function box(
    x,y,z,
    sx,sy,sz,
    material,
    parent=scene
){

    const geometry =
        new THREE.BoxGeometry(
            sx,sy,sz
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        x,y,z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);

    return mesh;
}


function cyl(
    x,y,z,
    radius,
    height,
    material,
    segments=10,
    parent=scene
){

    const geometry =
        new THREE.CylinderGeometry(
            radius,
            radius,
            height,
            segments
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        x,y,z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);

    return mesh;
}


function sphere(
    x,y,z,
    radius,
    material,
    parent=scene
){

    const geometry =
        new THREE.SphereGeometry(
            radius,
            12,
            8

            geometry,
            material

    mesh.position.set(

    parent.add(mesh);

    return mesh;
}


function cone(

    parent.add(mesh);

    return mesh;
}

/* =========================================================
   CÁMARA MOUSE
   ========================================================= */

let cameraYaw = 0;

let cameraPitch = 0.35;


document.addEventListener(
    "mousemove",
    function(event){

        if(
            !document.pointerLockElement
        ){
            return;
        }

        cameraYaw -=
            event.movementX * 0.0025;

        cameraPitch -=
            event.movementY * 0.002;

        cameraPitch =
            Math.max(
                -0.2,
                Math.min(
                    0.9,
                    cameraPitch
                )
            );
    }
);

/* =========================================================

   ========================================================= */

function updateZone(){

    const relative =
        START_Z-
        player.position.z;

    let index =
        Math.floor(
            relative /
            ZONE_LENGTH
        );

    index =
        Math.max(
            0,
            Math.min(
                zones.length-1,
                index
            )
        );

    document.getElementById(
        "zone"
    ).textContent =
        zones[index].name;
}


/* =========================================================
   ACTUALIZAR JUGADOR
   ========================================================= */

function updatePlayer(){

    const speed =
        keys["ShiftLeft"] ||
        keys["ShiftRight"]
            ? .32
            : .20;

    let dx = 0;
    let dz = 0;

    if(keys["KeyW"])
        dz -= 1;

    if(keys["KeyS"])
        dz += 1;

    if(keys["KeyA"])
        dx -= 1;

    if(keys["KeyD"])
        dx += 1;


    if(
        dx !== 0 ||
        dz !== 0
    ){

        const length =
            Math.sqrt(
                dx*dx+
                dz*dz
            );

        dx /= length;
        dz /= length;

        player.position.x +=
            dx*speed;

        player.position.z +=
            dz*speed;
    }


    playerVelocityY +=
        gravity;

    player.position.y +=
        playerVelocityY;


    if(
        player.position.y < 0
    ){

        player.position.y = 0;
        playerVelocityY = 0;
    }


    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -HALF_WIDTH+13,
            HALF_WIDTH-13
        );


    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            END_Z+12,
            START_Z+35
        );


    updateZone();
}


/* =========================================================
   CÁMARA
   ========================================================= */

function updateCamera(){

    const distance = 38;

    const horizontalDistance =
        Math.cos(cameraPitch) *
        distance;


    const cameraX =
        player.position.x -
        Math.sin(cameraYaw) *
        horizontalDistance;


    const cameraY =
        player.position.y+
        12+
        Math.sin(cameraPitch) *
        distance;


    const cameraZ =
        player.position.z+
        Math.cos(cameraYaw) *
        horizontalDistance;


    const cameraPosition =
        new THREE.Vector3(
            cameraX,
            cameraY,
            cameraZ
        );


    camera.position.lerp(
        cameraPosition,
        .12
    );


    const target =
        new THREE.Vector3(
            player.position.x,
            player.position.y+5,
            player.position.z
        );


    camera.lookAt(
        target
    );
}

);
