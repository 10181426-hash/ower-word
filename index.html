<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OWNER WORLD V0.8</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#050711;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    top:15px;
    left:15px;
    z-index:20;
    color:white;
    pointer-events:none;
}

.logo{
    font-size:25px;
    font-weight:900;
    text-shadow:
        0 0 8px #6d5cff,
        0 0 18px #9b5cff;
}

.version{
    font-size:13px;
    opacity:.75;
    margin-top:2px;
}

.money{
    margin-top:10px;
    font-size:20px;
    font-weight:bold;
}

.zone{
    margin-top:5px;
    font-size:15px;
}

.speed{
    margin-top:7px;
    font-size:17px;
}

#interaction{
    position:fixed;
    bottom:28px;
    left:50%;
    transform:translateX(-50%);
    z-index:30;
    color:white;
    background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.25);
    padding:10px 18px;
    border-radius:12px;
    display:none;
    font-weight:bold;
}

#startScreen{
    position:fixed;
    inset:0;
    z-index:100;
    background:
        radial-gradient(circle at center,#171642 0%,#070817 45%,#02030a 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.startBox{
    width:min(440px,90%);
    padding:35px;
    text-align:center;
    border-radius:25px;
    background:rgba(12,14,35,.88);
    border:1px solid rgba(150,120,255,.5);
    box-shadow:
        0 0 35px rgba(100,80,255,.25),
        inset 0 0 30px rgba(120,90,255,.05);
}

.startLogo{
    font-size:42px;
    font-weight:1000;
    letter-spacing:2px;
    text-shadow:
        0 0 10px #6e63ff,
        0 0 30px #9e72ff;
}

.startVersion{
    margin-top:5px;
    opacity:.7;
}

.startBox input{
    width:100%;
    margin-top:25px;
    padding:14px;
    border-radius:12px;
    border:1px solid #6257c9;
    background:#090b1d;
    color:white;
    font-size:16px;
    outline:none;
}

.startBox button{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:12px;
    color:white;
    background:linear-gradient(90deg,#5547d9,#874fff);
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#error{
    min-height:20px;
    margin-top:10px;
    color:#ff7777;
    font-size:14px;
}

#adminButton{
    position:fixed;
    top:15px;
    right:15px;
    z-index:50;
    display:none;
    border:1px solid rgba(180,150,255,.7);
    background:rgba(15,10,40,.82);
    color:white;
    border-radius:12px;
    padding:10px 14px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 15px rgba(120,80,255,.25);
}

#adminPanel{
    position:fixed;
    top:65px;
    right:15px;
    z-index:60;
    width:320px;
    max-height:calc(100vh - 85px);
    overflow:auto;
    display:none;
    padding:18px;
    color:white;
    border-radius:18px;
    background:rgba(8,8,25,.95);
    border:1px solid rgba(150,120,255,.55);
    box-shadow:0 0 30px rgba(110,80,255,.3);
}

#adminPanel h2{
    margin:0 0 15px;
    color:#fff;
    text-shadow:0 0 10px #927cff;
}

.adminSection{
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,.12);
}

.adminPanel label{
    display:block;
    margin:8px 0 5px;
    font-size:13px;
    opacity:.8;
}

#adminPanel input,
#adminPanel select,
#adminPanel textarea{
    width:100%;
    padding:10px;
    border-radius:9px;
    border:1px solid rgba(150,130,255,.35);
    background:#11132a;
    color:white;
    outline:none;
}

#adminPanel button{
    width:100%;
    margin-top:8px;
    padding:10px;
    border:0;
    border-radius:9px;
    background:#6655df;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.scope{
    display:flex;
    gap:8px;
}

.scope button{
    flex:1;
}

.scope .active{
    background:#9a62ff !important;
}

#adminStatus{
    margin-top:10px;
    font-size:13px;
    color:#a99cff;
}

#messageContainer{
    position:fixed;
    top:95px;
    left:50%;
    transform:translateX(-50%);
    z-index:40;
    pointer-events:none;
    width:min(700px,90%);
}

.adminMessage{
    text-align:center;
    margin-bottom:10px;
    animation:messageIn .35s ease-out;
}

.adminMessage .adminName{
    color:white;
    font-size:15px;
    font-weight:900;
    letter-spacing:2px;
}

.adminMessage .messageText{
    color:white;
    font-size:20px;
    font-weight:bold;
    text-shadow:0 0 8px rgba(255,255,255,.4);
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(-15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

#music{
    position:fixed;
    bottom:15px;
    right:15px;
    z-index:30;
    color:white;
    background:rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.2);
    padding:8px 12px;
    border-radius:10px;
    font-size:12px;
}
</style>
</head>

<body>

<div id="hud">
    <div class="logo">👑 OWNER WORLD</div>
    <div class="version">V0.8</div>
    <div class="money">💰 <span id="money">0</span></div>
    <div class="zone">📍 <span id="zone">Pradera Inicial</span></div>
    <div class="speed">👟 ⚡ <span id="speed">10</span></div>
</div>

<button id="adminButton">👑 ADMIN</button>

<div id="adminPanel">
    <h2>🌌 ADMIN PANEL</h2>

    <div class="adminSection">
        <b>Alcance</b>
        <div class="scope">
            <button id="globalBtn" class="active">🌎 GLOBAL</button>
            <button id="serverBtn">🖥️ ESTE SERVIDOR</button>
        </div>
    </div>

    <div class="adminSection">
        <label>📢 Mensaje ADMIN</label>
        <textarea id="adminMessageInput" rows="3"
            placeholder="Escribe un mensaje..."></textarea>
        <button id="sendMessage">ENVIAR MENSAJE</button>
    </div>

    <div class="adminSection">
        <label>🎉 Evento</label>
        <select id="eventSelect">
            <option value="none">Sin evento</option>
            <option value="galaxy">🌌 EVENTO GALAXY</option>
        </select>
        <button id="activateEvent">ACTIVAR EVENTO</button>
        <button id="stopEvent">DETENER EVENTO</button>
    </div>

    <div class="adminSection">
        <label>👹 Boss</label>
        <select id="bossSelect">
            <option>Gallina Gigante</option>
            <option>Tigre</option>
            <option>Coloso Dorado</option>
            <option>Titán Glacial</option>
            <option>Cerberus</option>
            <option>Ballena Gigante</option>
            <option>Devorador Cósmico</option>
            <option>Guardián Eterno</option>
            <option>Dios Celestial</option>
        </select>
        <button id="bossInfo">VER JEFE DE SU ZONA</button>
    </div>

    <div class="adminSection">
        <label>📊 Encuesta</label>
        <input id="pollInput" placeholder="Pregunta de encuesta">
        <button id="sendPoll">PUBLICAR ENCUESTA</button>
    </div>

    <div id="adminStatus"></div>
</div>

<div id="interaction"></div>

<div id="messageContainer"></div>

<div id="music">🎹 Piano elegante</div>

<div id="startScreen">
    <div class="startBox">
        <div class="startLogo">OWNER WORLD</div>
        <div class="startVersion">V0.8</div>

        <input
            id="nameInput"
            maxlength="16"
            placeholder="Escribe tu nombre"
            autocomplete="off"
        >

        <button id="playButton">JUGAR</button>

        <div id="error"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   OWNER WORLD V0.8
   ========================================================= */

const VERSION = "V0.8";

const zones = [
    {
        name:"Pradera Inicial",
        emoji:"🌿",
        color:0x65b84a,
        eggColor:0x8bdc63,
        z:0,
        boss:"Gallina Gigante"
    },
    {
        name:"Bosque Encantado",
        emoji:"🌲",
        color:0x286c42,
        eggColor:0x4c9c59,
        z:-155,
        boss:"Tigre"
    },
    {
        name:"Desierto Dorado",
        emoji:"🏜️",
        color:0xd5a743,
        eggColor:0xe7bb4d,
        z:-310,
        boss:"Coloso Dorado"
    },
    {
        name:"Cumbres Heladas",
        emoji:"❄️",
        color:0x9fdaf0,
        eggColor:0xbcecff,
        z:-465,
        boss:"Titán Glacial"
    },
    {
        name:"Volcán Carmesí",
        emoji:"🌋",
        color:0xa53d32,
        eggColor:0xf15a3d,
        z:-620,
        boss:"Cerberus"
    },
    {
        name:"Abismo Marino",
        emoji:"🌊",
        color:0x1975a5,
        eggColor:0x3fb7e8,
        z:-775,
        boss:"Ballena Gigante"
    },
    {
        name:"Galaxia Perdida",
        emoji:"🌌",
        color:0x51368c,
        eggColor:0xa86cff,
        z:-930,
        boss:"Devorador Cósmico"
    },
    {
        name:"Santuario Eterno",
        emoji:"♾️",
        color:0x7048a0,
        eggColor:0xc48cff,
        z:-1085,
        boss:"Guardián Eterno"
    },
    {
        name:"Dominio Divino",
        emoji:"✨",
        color:0xcaa92f,
        eggColor:0xffd94d,
        z:-1240,
        boss:"Dios Celestial"
    }
];

const MAP_WIDTH = 250;
const ZONE_LENGTH = 155;

let scene;
let camera;
let renderer;

let player;
let playerVelocityY = 0;

let money = 0;
let playerName = "";

let playerSpeed = 10;
let treadmill = null;
let claimedCorral = null;

let currentZoneIndex = 0;

let cameraYaw = 0;
let cameraPitch = 0.35;

let keys = {};

let audioStarted = false;
let pianoGain;
let galaxyGain;

let galaxyEvent = false;

const eggs = [];
const bosses = [];
const corrals = [];

/* =========================================================
   START
   ========================================================= */

const startScreen = document.getElementById("startScreen");
const nameInput = document.getElementById("nameInput");
const playButton = document.getElementById("playButton");
const errorBox = document.getElementById("error");

const bannedWords = [
    "puta",
    "puto",
    "pendejo",
    "idiota",
    "mierda",
    "estupido",
    "estúpido",
    "fuck",
    "shit"
];

function validName(name){

    if(!name) return false;

    if(name.length < 2 || name.length > 16){
        return false;
    }

    const lower = name.toLowerCase();

    for(const word of bannedWords){
        if(lower.includes(word)){
            return false;
        }
    }

    return true;
}

playButton.addEventListener("click", startGame);

nameInput.addEventListener("keydown",e=>{
    if(e.key === "Enter"){
        startGame();
    }
});

function startGame(){

    const name = nameInput.value.trim();

    if(!validName(name)){
        errorBox.textContent =
            "⚠️ Escribe un nombre válido y sin palabras ofensivas.";
        return;
    }

    playerName = name;

    startScreen.style.display = "none";

    if(playerName.toUpperCase() === "ERICK"){
        document.getElementById("adminButton").style.display = "block";
    }

    initGame();

    startAudio();

    showAdminMessage(
        "👑 " + playerName + " ha entrado al servidor"
    );
}

/* =========================================================
   THREE
   ========================================================= */

function initGame(){

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x86c8ff);

    scene.fog = new THREE.Fog(
        0x86c8ff,
        250,
        1500
    );

    camera = new THREE.PerspectiveCamera(
        70,
        innerWidth / innerHeight,
        0.1,
        3000
    );

    camera.position.set(
        0,
        15,
        50
    );

    renderer = new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,2)
    );

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.shadowMap.enabled = true;

    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(
        0xbfdfff,
        0x4c593c,
        1.7
    );

    scene.add(hemi);

    const sun = new THREE.DirectionalLight(
        0xffffff,
        2.2
    );

    sun.position.set(
        100,
        250,
        100
    );

    sun.castShadow = true;

    scene.add(sun);

    createMap();
    createCorrals();
    createPlayer();
    createEggs();
    createBosses();

    window.addEventListener(
        "resize",
        resize
    );

    window.addEventListener(
        "keydown",
        keyDown
    );

    window.addEventListener(
        "keyup",
        keyUp
    );

    window.addEventListener(
        "mousemove",
        mouseMove
    );

    animate();
}

/* =========================================================
   MATERIAL HELPERS
   ========================================================= */

function mat(color){

    return new THREE.MeshStandardMaterial({
        color,
        roughness:.85,
        metalness:.05
    });
}

function box(
    x,
    y,
    z,
    sx,
    sy,
    sz,
    color
){

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(
            sx,
            sy,
            sz
        ),
        mat(color)
    );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;
}

function sphere(
    x,
    y,
    z,
    radius,
    color
){

    const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(
            radius,
            16,
            12
        ),
        mat(color)
    );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;

    scene.add(mesh);

    return mesh;
}

/* =========================================================
   MAP
   ========================================================= */

function createMap(){

    const totalLength =
        ZONE_LENGTH * zones.length + 180;

    const ground = box(
        0,
        -2,
        -550,
        MAP_WIDTH,
        4,
        totalLength,
        0x4f7d3f
    );

    ground.receiveShadow = true;

    /* Camino */

    box(
        0,
        .03,
        -550,
        34,
        .08,
        totalLength,
        0x575757
    );

    /* Líneas del camino */

    for(let z=80;z>-1400;z-=30){

        box(
            0,
            .09,
            z,
            2,
            .03,
            13,
            0xe7d889
        );
    }

    createOuterWalls();

    zones.forEach((zone,index)=>{

        createZoneDecorations(
            zone,
            index
        );

        createZoneSign(
            zone
        );
    });

    /* Plaza inicial */

    const plaza = new THREE.Mesh(
        new THREE.CylinderGeometry(
            42,
            42,
            1,
            48
        ),
        mat(0x777777)
    );

    plaza.position.set(
        0,
        .5,
        72
    );

    plaza.receiveShadow = true;

    scene.add(plaza);

    /* Portal */

    const portal = new THREE.Mesh(
        new THREE.TorusGeometry(
            10,
            1.3,
            16,
            40
        ),
        new THREE.MeshStandardMaterial({
            color:0x805cff,
            emissive:0x351f8c,
            emissiveIntensity:1.8
        })
    );

    portal.position.set(
        0,
        11,
        50
    );

    portal.rotation.x =
        Math.PI / 2;

    scene.add(portal);
}

/* =========================================================
   OUTER WALLS
   ========================================================= */

function createOuterWalls(){

    const wallHeight = 28;

    const left = box(
        -MAP_WIDTH/2,
        wallHeight/2,
        -550,
        4,
        wallHeight,
        1550,
        0x705438
    );

    const right = box(
        MAP_WIDTH/2,
        wallHeight/2,
        -550,
        4,
        wallHeight,
        1550,
        0x705438
    );

    /* Grass tops */

    box(
        -MAP_WIDTH/2,
        wallHeight+1,
        -550,
        5,
        2,
        1550,
        0x57953d
    );

    box(
        MAP_WIDTH/2,
        wallHeight+1,
        -550,
        5,
        2,
        1550,
        0x57953d
    );
}

/* =========================================================
   ZONE DECORATION
   ========================================================= */

function createZoneDecorations(
    zone,
    index
){

    const start = zone.z + 65;
    const end = zone.z - 65;

    for(
        let z=start;
        z>end;
        z-=18
    ){

        const side =
            Math.random() < .5
            ? -1
            : 1;

        const x =
            side *
            (45 + Math.random()*55);

        if(index===0){
            createFlower(x,z);
        }

        if(index===1){
            createTree(x,z);
        }

        if(index===2){
            createCactus(x,z);
        }

        if(index===3){
            createIce(x,z);
        }

        if(index===4){
            createVolcanoRock(x,z);
        }

        if(index===5){
            createCoral(x,z);
        }

        if(index===6){
            createGalaxyCrystal(x,z);
        }

        if(index===7){
            createSanctuaryCrystal(x,z);
        }

        if(index===8){
            createDivineCrystal(x,z);
        }
    }
}

function createFlower(x,z){

    sphere(
        x,
        1.1,
        z,
        .8,
        0xff77aa
    );

    box(
        x,
        .5,
        z,
        .15,
        1,
        .15,
        0x3e8f42
    );
}

function createTree(x,z){

    box(
        x,
        5,
        z,
        2.2,
        9,
        2.2,
        0x714727
    );

    sphere(
        x,
        10,
        z,
        5,
        0x287342
    );
}

function createCactus(x,z){

    box(
        x,
        3,
        z,
        2,
        6,
        2,
        0x3d9845
    );

    box(
        x+2,
        3,
        z,
        1.5,
        3,
        1.5,
        0x3d9845
    );
}

function createIce(x,z){

    const crystal = new THREE.Mesh(
        new THREE.ConeGeometry(
            3,
            10,
            6
        ),
        mat(0xc5f4ff)
    );

    crystal.position.set(
        x,
        5,
        z
    );

    crystal.castShadow = true;

    scene.add(crystal);
}

function createVolcanoRock(x,z){

    sphere(
        x,
        2,
        z,
        3.5,
        0x383838
    );
}

function createCoral(x,z){

    for(let i=0;i<3;i++){

        box(
            x+i*2-2,
            2,
            z,
            1.3,
            4+Math.random()*2,
            1.3,
            0xe66b89
        );
    }
}

function createGalaxyCrystal(x,z){

    const c = new THREE.Mesh(
        new THREE.OctahedronGeometry(3),
        new THREE.MeshStandardMaterial({
            color:0x9b4cff,
            emissive:0x451a86,
            emissiveIntensity:1.2
        })
    );

    c.position.set(
        x,
        3,
        z
    );

    scene.add(c);
}

function createSanctuaryCrystal(x,z){

    const c = new THREE.Mesh(
        new THREE.OctahedronGeometry(3.5),
        new THREE.MeshStandardMaterial({
            color:0xb56cff,
            emissive:0x5c238c,
            emissiveIntensity:1.2
        })
    );

    c.position.set(
        x,
        4,
        z
    );

    scene.add(c);
}

function createDivineCrystal(x,z){

    const c = new THREE.Mesh(
        new THREE.OctahedronGeometry(4),
        new THREE.MeshStandardMaterial({
            color:0xffd94a,
            emissive:0xb87b00,
            emissiveIntensity:1.4
        })
    );

    c.position.set(
        x,
        4,
        z
    );

    scene.add(c);
}

/* =========================================================
   ZONE SIGNS
   ========================================================= */

function createZoneSign(zone){

    const canvas =
        document.createElement("canvas");

    canvas.width = 512;
    canvas.height = 128;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 42px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        zone.emoji+" "+zone.name,
        256,
        70
    );

    const texture =
        new THREE.CanvasTexture(canvas);

    const sprite =
        new THREE.Sprite(
            new THREE.SpriteMaterial({
                map:texture,
                transparent:true
            })
        );

    sprite.scale.set(
        50,
        12.5,
        1
    );

    sprite.position.set(
        0,
        17,
        zone.z
    );

    scene.add(sprite);
}

/* =========================================================
   CORRALS
   ========================================================= */

function createCorrals(){

    const positions = [
        -90,
        -30,
        30,
        90
    ];

    positions.forEach((x,index)=>{

        const floor = box(
            x,
            .15,
            45,
            45,
            .3,
            42,
            0x7d9b63
        );

        floor.userData.corral =
            index;

        const sign = createCorralSign(
            x,
            index
        );

        const corral = {
            index,
            x,
            z:45,
            claimed:false,
            treadmill:null,
            pets:[]
        };

        corrals.push(corral);

        /* Caminadora FUERA */

        const treadmillObj =
            createTreadmill(
                x,
                17
            );

        corral.treadmill =
            treadmillObj;

        treadmillObj.visible = false;
    });
}

){

        6,
        1
    );

    sprite.position.set(

        7,

/* =========================================================
   EGGS
   ========================================================= */

function createEggs(){

    zones.forEach((zone,index)=>{

        const egg =
            createEgg(
                zone,
                index
            );

        eggs.push(egg);
    });
}

function createEgg(
    zone,
    index
){

    const group =
        new THREE.Group();

    const eggMaterial =
        new THREE.MeshStandardMaterial({
            color:zone.eggColor,
            roughness:.45,
            metalness:.15
        });

    const body =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                3,
                24,
                16
            ),
            eggMaterial
        );

    body.scale.y = 1.25;

    body.castShadow = true;

    group.add(body);

    /* Diseño especial según zona */

    if(index===0){

        for(let i=0;i<4;i++){

            const leaf = new THREE.Mesh(
                new THREE.BoxGeometry(
                    .4,
                    2,
                    1.4
                ),
                mat(0x48a84c)
            );

            leaf.position.set(
                Math.cos(i)*2,
                0,
                Math.sin(i)*2
            );

            leaf.rotation.y = i;

            group.add(leaf);
        }
    }

    if(index===1){

        for(let i=0;i<5;i++){

            const line = new THREE.Mesh(
                new THREE.BoxGeometry(
                    .3,
                    4,
                    .4
                ),
                mat(0x70452d)
            );

            line.position.set(
                Math.cos(i)*2,
                0,
                Math.sin(i)*2
            );

            group.add(line);
        }
    }

    if(index===2){

        const ring = new THREE.Mesh(
            new THREE.TorusGeometry(
                2.3,
                .25,
                10,
                24
            ),
            mat(0xffd95c)
        );

        ring.rotation.x =
            Math.PI/2;

        group.add(ring);
    }

    if(index===3){

        const crystal = new THREE.Mesh(
            new THREE.ConeGeometry(
                .7,
                3,
                5
            ),
            mat(0xe5fbff)
        );

        crystal.position.y = 2;

        group.add(crystal);
    }

    if(index===4){

        const lava = new THREE.Mesh(
            new THREE.TorusGeometry(
                2,
                .3,
                10,
                24
            ),
            mat(0xff3e19)
        );

        lava.rotation.x =
            Math.PI/2;

        group.add(lava);
    }

    if(index===5){

        const fin = new THREE.Mesh(
            new THREE.ConeGeometry(
                .7,
                3,
                5
            ),
            mat(0x8ceaff)
        );

        fin.rotation.z =
            Math.PI/2;

        group.add(fin);
    }

    if(index>=6){

        const ring = new THREE.Mesh(
            new THREE.TorusGeometry(
                3,
                .18,
                8,
                24
            ),
            mat(
                index===8
                ? 0xffdf54
                : 0xd07cff
            )
        );

        ring.rotation.x =
            Math.PI/2;

        group.add(ring);
    }

    group.position.set(
        55,
        4,
        zone.z
    );

    group.userData.zone =
        index;

    group.userData.type =
        "egg";

    scene.add(group);

    return group;
}

/* =========================================================
   BOSSES
   ========================================================= */

function createBosses(){

    zones.forEach(
        (zone,index)=>{

            const boss =
                createBoss(

                );

            bosses.push(boss);
        }
    );
}

function createBoss(
    zone,
    index
){

    const group =
        new THREE.Group();

    let bodyColor =
        0x8c8c8c;

    if(index===0){
        bodyColor=0xffffff;
    }

    if(index===1){
        bodyColor=0xd68b2e;
    }

    if(index===2){
        bodyColor=0xd7a82f;
    }

    if(index===3){
        bodyColor=0x9edfff;
    }

    if(index===4){
        bodyColor=0x3a1111;
    }

    if(index===5){
        bodyColor=0x6fa8c8;
    }

    if(index===6){
        bodyColor=0x8c55d9;
    }

    if(index===7){
        bodyColor=0x9b64d4;
    }

    if(index===8){
        bodyColor=0xffd64b;
    }

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                8,
                7,
                6
            ),
            mat(bodyColor)
        );

    body.position.y = 5;

    group.add(body);

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                4,
                16,
                12
            ),
            mat(bodyColor)
        );

    head.position.y = 10;

    group.add(head);

    /* Características especiales */

    if(index===0){

        const comb =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    3,
                    2,
                    1
                ),
                mat(0xe33a32)
            );

        comb.position.set(
            0,
            14,
            0
        );

        group.add(comb);
    }

    if(index===1){

        for(let i=-1;i<=1;i++){

            const stripe =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .5,
                        7,
                        6.2
                    ),
                    mat(0x111111)
                );

            stripe.position.x =
                i*2;

            stripe.position.y =
                5;

            group.add(stripe);
        }
    }

    if(index===4){

        /* Tres cabezas de Cerberus */

        for(let i=-1;i<=1;i++){

            const head2 =
                new THREE.Mesh(
                    new THREE.SphereGeometry(
                        2.5,
                        16,
                        12
                    ),
                    mat(0x3a1111)
                );

            head2.position.set(
                i*3,
                11,
                0
            );

            group.add(head2);
        }
    }

    if(index===5){

        const tail =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    4,
                    16,
                    10
                ),
                mat(bodyColor)
            );

        tail.scale.set(
            2,
            .7,
            .7
        );

        tail.position.x =
            -6;

        tail.position.y =
            5;

        group.add(tail);
    }

    group.position.set(
        -60,
        0,
        zone.z
    );

    group.userData.boss =
        zone.boss;

    group.userData.zone =
        index;

    scene.add(group);

    return group;
}

/* =========================================================
   INPUT
   ========================================================= */

function keyDown(e){

    keys[e.code] = true;

    if(e.code === "Space"){

        if(
            player &&
            player.position.y <= .05
        ){

            playerVelocityY =
                .55;
        }
    }

    if(e.code === "KeyE"){

        interact();
    }
}

function keyUp(e){

    keys[e.code] = false;
}

function mouseMove(e){

    if(!player) return;

    cameraYaw -=
        e.movementX * .0025;

    cameraPitch -=
        e.movementY * .002;

    cameraPitch =
        Math.max(
            -.2,
            Math.min(
                .9,
                cameraPitch
            )
        );
}

/* =========================================================
   INTERACTION E
   ========================================================= */

function interact(){

    if(!player) return;

    /* Huevo */

    for(let i=eggs.length-1;i>=0;i--){

        const egg =
            eggs[i];

        if(!egg.visible) continue;

        const distance =
            player.position.distanceTo(
                egg.position
            );

        if(distance < 10){

            egg.visible = false;

            money += 100;

            updateHUD();

            showAdminMessage(
                "🥚 ¡Has agarrado un huevo de "+
                zones[egg.userData.zone].name+"!"
            );

            return;
        }
    }

    /* Corral */

    for(const corral of corrals){

        if(corral.claimed) continue;

        const distance =
            Math.hypot(
                player.position.x-corral.x,
                player.position.z-corral.z
            );

        if(distance < 15){

            claimCorral(
                corral
            );

            return;
        }
    }
}

/* =========================================================
   CLAIM CORRAL
   ========================================================= */

function claimCorral(
    corral
){

    corral.claimed = true;

    claimedCorral =
        corral;

    corral.treadmill.visible =
        true;

    treadmill =
        corral.treadmill;

    showAdminMessage(
        "🏠 CORRAL "+(corral.index+1)+
        " RECLAMADO"
    );
}

/* =========================================================
   MOVEMENT
   ========================================================= */

function updatePlayer(){

    if(!player) return;

    const direction =
        new THREE.Vector3();

    if(keys["KeyW"]){
        direction.z -= 1;
    }

    if(keys["KeyS"]){
        direction.z += 1;
    }

    if(keys["KeyA"]){
        direction.x -= 1;
    }

    if(keys["KeyD"]){
        direction.x += 1;
    }

    if(direction.length()>0){

        direction.normalize();

        let moveSpeed =
            .65;

        if(keys["ShiftLeft"] ||
           keys["ShiftRight"]){

            moveSpeed =
                1.15;
        }

        player.position.x +=
            direction.x * moveSpeed;

        player.position.z +=
            direction.z * moveSpeed;
    }

    /* gravedad */

    playerVelocityY -=
        .025;

    player.position.y +=
        playerVelocityY;

    if(player.position.y<0){

        player.position.y=0;
        playerVelocityY=0;
    }

    /* límites exteriores */

    player.position.x =
        Math.max(
            -MAP_WIDTH/2+7,
            Math.min(
                MAP_WIDTH/2-7,
                player.position.x
            )
        );

    player.position.z =
        Math.max(
            -1340,
            Math.min(
                100,
                player.position.z
            )
        );

    /* Caminadora */

    if(
        claimedCorral &&
        treadmill
    ){

        const distance =
            Math.hypot(
                player.position.x -
                treadmill.position.x,

                player.position.z -
                treadmill.position.z
            );

        if(distance < 7){

            playerSpeed +=
                .015;

            playerSpeed =
                Math.min(
                    playerSpeed,
                    999
                );

            document.getElementById(
                "speed"
            ).textContent =
                Math.floor(playerSpeed);
        }
    }
}

/* =========================================================
   ZONE
   ========================================================= */

function updateZone(){

    if(!player) return;

    let closest =
        0;

    let best =
        Infinity;

    zones.forEach(
        (zone,index)=>{

            const distance =
                Math.abs(
                    player.position.z -
                    zone.z
                );

            if(distance < best){

                best =
                    distance;

                closest =
                    index;
            }
        }
    );

    if(
        closest !==
        currentZoneIndex
    ){

        currentZoneIndex =
            closest;
    }

    document.getElementById(
        "zone"
    ).textContent =
        zones[currentZoneIndex].name;
}

/* =========================================================
   CAMERA
   ========================================================= */

function updateCamera(){

    const distance =
        38;

    const horizontal =
        Math.cos(cameraPitch) *
        distance;

    const target =
        new THREE.Vector3(
            player.position.x -
            Math.sin(cameraYaw) *
            horizontal,

            player.position.y +
            12 +
            Math.sin(cameraPitch) *
            distance,

            player.position.z +
            Math.cos(cameraYaw) *
            horizontal
        );

    camera.position.lerp(
        target,
        .12
    );

    camera.lookAt(
        player.position.x,
        player.position.y+5,
        player.position.z
    );
}

/* =========================================================
   HUD

function updateHUD(){

/* =========================================================
   ADMIN MESSAGES
   ========================================================= */

function showAdminMessage(
    message
){

    const container =
        document.getElementById(
            "messageContainer"
        );

    const div =
        document.createElement("div");

    div.className =
        "adminMessage";

    div.innerHTML =
        `<div class="adminName">ADMIN</div>
         <div class="messageText">${escapeHTML(message)}</div>`;

    container.appendChild(div);

    setTimeout(()=>{
        div.remove();
    },5000);
}

function escapeHTML(text){

    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function stopGalaxy(){

/* =========================================================
   AUDIO
   ========================================================= */

/*
   El piano se genera con Web Audio.
   No depende de una canción comercial externa.
   Se reproduce como música permanente del juego.
*/

function startAudio(){

    if(audioStarted) return;

    audioStarted =
        true;

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContext) return;

    const ctx =
        new AudioContext();

    pianoGain =
        ctx.createGain();

    galaxyGain =
        ctx.createGain();

    pianoGain.gain.value =
        .045;

    galaxyGain.gain.value =
        0;

    pianoGain.connect(
        ctx.destination
    );

    galaxyGain.connect(
        ctx.destination
    );

    /* Piano elegante permanente */

    const notes = [
        261.63,
        329.63,
        392.00,
        523.25,
        392.00,
        329.63,
        293.66,
        349.23
    ];

    let noteIndex = 0;

    function playPianoNote(){

        if(!pianoGain) return;

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.type =
            "sine";

        osc.frequency.value =
            notes[noteIndex];

        gain.gain.setValueAtTime(
            0,
            ctx.currentTime
        );

        gain.gain.linearRampToValueAtTime(
            .35,
            ctx.currentTime+.08
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime+2.3
        );

        osc.connect(gain);
        gain.connect(pianoGain);

        osc.start();
        osc.stop(
            ctx.currentTime+2.4
        );

        noteIndex =
            (noteIndex+1) %
            notes.length;
    }

    playPianoNote();

    setInterval(
        playPianoNote,
        1450
    );

    /* Ambiente Galaxy */

    function galaxySound(){

        if(!galaxyEvent) return;

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.type =
            "sine";

        osc.frequency.value =
            110 +
            Math.random()*80;

        gain.gain.setValueAtTime(
            0,
            ctx.currentTime
        );

        gain.gain.linearRampToValueAtTime(
            .25,
            ctx.currentTime+.5
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime+3
        );

        osc.connect(gain);
        gain.connect(galaxyGain);

        osc.start();
        osc.stop(
            ctx.currentTime+3
        );
    }

    setInterval(
        galaxySound,
        2200
    );
}

/* =========================================================
   ANIMATION
   ========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    if(player){

        updatePlayer();
        updateZone();
        updateCamera();

        eggs.forEach(
            egg=>{

                if(egg.visible){

                    egg.rotation.y +=
                        .01;

                    egg.position.y =
                        4 +
                        Math.sin(
                            performance.now()*.002
                        )*.4;
                }
            }
        );

        bosses.forEach(
            boss=>{

                boss.rotation.y +=
                    .0015;

                boss.position.y =
                    Math.sin(
                        performance.now()*.001+
                        boss.userData.zone
                    )*.15;
            }
        );
    }

    renderer.render(
        scene,
        camera
    );
}

/* =========================================================
   RESIZE
   ========================================================= */

function resize(){

    if(!camera || !renderer)
        return;

    camera.aspect =
        innerWidth /
        innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );
}
