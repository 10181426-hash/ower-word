<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OWNER WORLD V0.5</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#87ceeb;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#hud{
    position:fixed;
    top:15px;
    left:15px;
    z-index:10;
    color:white;
    font-weight:bold;
    text-shadow:0 3px 8px #000;
    pointer-events:none;
}

#title{
    font-size:28px;
    letter-spacing:2px;
}

#version{
    font-size:14px;
    opacity:.8;
    margin-top:3px;
}

#money{
    margin-top:10px;
    font-size:22px;
}

#zone{
    margin-top:6px;
    font-size:18px;
}

#announcement{
    position:fixed;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    padding:14px 24px;
    border-radius:15px;
    background:rgba(10,10,25,.9);
    color:white;
    font-size:20px;
    font-weight:bold;
    text-align:center;
    box-shadow:0 5px 25px rgba(0,0,0,.5);
    display:none;
    pointer-events:none;
}

#controls{
    position:fixed;
    bottom:15px;
    left:15px;
    z-index:10;
    padding:10px 14px;
    border-radius:12px;
    background:rgba(0,0,0,.55);
    color:white;
    font-size:13px;
    line-height:1.6;
    pointer-events:none;
}

#startScreen{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,#182b58 0%,#07101f 45%,#02050c 100%);
}

.startBox{
    width:min(90%,500px);
    padding:45px 30px;
    border-radius:25px;
    text-align:center;
    color:white;
    background:rgba(10,20,45,.8);
    border:2px solid rgba(120,180,255,.35);
    box-shadow:
        0 0 40px rgba(70,130,255,.35),
        inset 0 0 35px rgba(70,130,255,.08);
}

.logo{
    font-size:48px;
    font-weight:900;
    letter-spacing:4px;
    text-shadow:
        0 0 10px #fff,
        0 0 25px #5d8cff,
        0 0 45px #7b4dff;
}

.startVersion{
    margin-top:8px;
    font-size:20px;
    color:#9ec5ff;
    font-weight:bold;
}

.startDescription{
    margin-top:20px;
    line-height:1.6;
    color:#dce8ff;
}

#playButton{
    margin-top:30px;
    padding:15px 45px;
    border:0;
    border-radius:14px;
    font-size:22px;
    font-weight:bold;
    color:white;
    background:linear-gradient(135deg,#3c75ff,#793dff);
    box-shadow:0 8px 25px rgba(70,80,255,.45);
    cursor:pointer;
    transition:.2s;
}

#playButton:hover{
    transform:scale(1.06);
    box-shadow:0 10px 35px rgba(90,100,255,.7);
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:7px;
    height:7px;
    margin-left:-3px;
    margin-top:-3px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 8px black;
    z-index:8;
    pointer-events:none;
    opacity:.7;
}
</style>
</head>

<body>

<div id="startScreen">
    <div class="startBox">
        <div class="logo">OWNER WORLD</div>
        <div class="startVersion">V0.5</div>

        <div class="startDescription">
            🌎 Explora las 9 zonas<br>
            🐾 Consigue mascotas<br>
            🥚 Descubre huevos<br>
            👑 Prepárate para convertirte en OWNER
        </div>

        <button id="playButton">JUGAR</button>
    </div>
</div>

<div id="hud">
    <div id="title">👑 OWNER WORLD</div>
    <div id="version">V0.5</div>
    <div id="money">💰 $0</div>
    <div id="zone">🌿 Pradera Inicial</div>
</div>

<div id="announcement"></div>

<div id="controls">
    <b>CONTROLES</b><br>
    W A S D — Moverse<br>
    SHIFT — Correr<br>
    SPACE — Saltar<br>
    MOUSE — Cámara
</div>

<div id="crosshair"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   OWNER WORLD V0.5
   ========================================================= */


/* =========================================================
   ESCENA
   ========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x79bde8);

scene.fog = new THREE.Fog(
    0x79bde8,
    180,
    1150
);


/* =========================================================
   CÁMARA
   ========================================================= */

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
);


/* =========================================================
   RENDERER
   ========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);


/* =========================================================
   LUCES
   ========================================================= */

const hemisphereLight =
    new THREE.HemisphereLight(
        0xbde8ff,
        0x4b3826,
        2.0
    );

scene.add(hemisphereLight);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.5
    );

sun.position.set(
    100,
    180,
    80
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -300;
sun.shadow.camera.right = 300;
sun.shadow.camera.top = 300;
sun.shadow.camera.bottom = -1300;

scene.add(sun);


/* =========================================================
   CONFIGURACIÓN DEL MAPA
   ========================================================= */

const MAP_WIDTH = 230;

const ZONE_LENGTH = 175;

const START_Z = 110;

const TOTAL_ZONES = 9;

const END_Z =
    START_Z -
    ZONE_LENGTH * TOTAL_ZONES;


/* =========================================================
   ZONAS
   ========================================================= */

const zones = [

    {
        name:"🌿 Pradera Inicial",
        color:0x65bd55
    },

    {
        name:"🌲 Bosque Encantado",
        color:0x327c43
    },

    {
        name:"🏜️ Desierto Dorado",
        color:0xd9ad4d
    },

    {
        name:"❄️ Cumbres Heladas",
        color:0xbce7f4
    },

    {
        name:"🌋 Volcán Carmesí",
        color:0x8d3028
    },

    {
        name:"🌊 Abismo Marino",
        color:0x126fa5
    },

    {
        name:"🌌 Galaxia Perdida",
        color:0x251b69
    },

    {
        name:"♾️ Santuario Eterno",
        color:0x4e2d82
    },

    {
        name:"✨ Dominio Divino",
        color:0xd7c76a
    }

];


/* =========================================================
   TERRENO
   ========================================================= */

const groundGeometry =
    new THREE.BoxGeometry(
        MAP_WIDTH,
        4,
        ZONE_LENGTH * TOTAL_ZONES + 100
    );

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color:0x4c8f4d,
        roughness:1
    });

const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

ground.position.set(
    0,
    -2,
    START_Z - (ZONE_LENGTH * TOTAL_ZONES)/2
);

ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   CAMINO CENTRAL
   ========================================================= */

const roadGeometry =
    new THREE.BoxGeometry(
        34,
        0.15,
        ZONE_LENGTH * TOTAL_ZONES + 20
    );

const roadMaterial =
    new THREE.MeshStandardMaterial({
        color:0x8a7968,
        roughness:1
    });

const road =
    new THREE.Mesh(
        roadGeometry,
        roadMaterial
    );

road.position.set(
    0,
    0.08,
    START_Z - (ZONE_LENGTH * TOTAL_ZONES)/2
);

road.receiveShadow = true;

scene.add(road);


/* =========================================================
   FRANJAS DE ZONAS
   ========================================================= */

function createZoneGround(
    index,
    color
){

    const geometry =
        new THREE.BoxGeometry(
            MAP_WIDTH - 8,
            0.35,
            ZONE_LENGTH - 4
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:1
        });

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        0,
        0.15,
        START_Z -
        index * ZONE_LENGTH -
        ZONE_LENGTH / 2
    );

    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;
}


zones.forEach(
    (zone,index)=>{
        createZoneGround(
            index,
            zone.color
        );
    }
);


/* =========================================================
   PAREDES EXTERIORES
   ========================================================= */

function createOuterWall(
    x,
    z,
    width,
    depth
){

    const dirtGeometry =
        new THREE.BoxGeometry(
            width,
            26,
            depth
        );

    const dirtMaterial =
        new THREE.MeshStandardMaterial({
            color:0x765334,
            roughness:1
        });

    const wall =
        new THREE.Mesh(
            dirtGeometry,
            dirtMaterial
        );

    wall.position.set(
        x,
        13,
        z
    );

    wall.castShadow = true;
    wall.receiveShadow = true;

    scene.add(wall);


    const grassGeometry =
        new THREE.BoxGeometry(
            width + 2,
            2.2,
            depth + 2
        );

    const grassMaterial =
        new THREE.MeshStandardMaterial({
            color:0x4e8d3e,
            roughness:1
        });

    const grass =
        new THREE.Mesh(
            grassGeometry,
            grassMaterial
        );

    grass.position.set(
        x,
        26.1,
        z
    );

    grass.castShadow = true;

    scene.add(grass);
}


/* izquierda */

createOuterWall(
    -MAP_WIDTH/2,
    START_Z - (ZONE_LENGTH*TOTAL_ZONES)/2,
    8,
    ZONE_LENGTH*TOTAL_ZONES + 50
);


/* derecha */

createOuterWall(
    MAP_WIDTH/2,
    START_Z - (ZONE_LENGTH*TOTAL_ZONES)/2,
    8,
    ZONE_LENGTH*TOTAL_ZONES + 50
);


/* inicio */

createOuterWall(
    0,
    START_Z + 45,
    MAP_WIDTH,
    8
);


/* final */

createOuterWall(
    0,
    END_Z - 45,
    MAP_WIDTH,
    8
);


/* =========================================================
   FUNCIONES DE DECORACIÓN
   ========================================================= */

function randomRange(min,max){
    return Math.random()*(max-min)+min;
}


/* =========================================================
   ÁRBOL
   ========================================================= */

function createTree(
    x,
    z,
    scale=1
){

    const group =
        new THREE.Group();


    const trunkGeometry =
        new THREE.CylinderGeometry(
            1.3*scale,
            1.7*scale,
            9*scale,
            8
        );

    const trunkMaterial =
        new THREE.MeshStandardMaterial({
            color:0x704323
        });

    const trunk =
        new THREE.Mesh(
            trunkGeometry,
            trunkMaterial
        );

    trunk.position.y =
        4.5*scale;

    trunk.castShadow = true;

    group.add(trunk);


    const leavesGeometry =
        new THREE.SphereGeometry(
            5.5*scale,
            8,
            8
        );

    const leavesMaterial =
        new THREE.MeshStandardMaterial({
            color:0x26783b
        });

    const leaves =
        new THREE.Mesh(
            leavesGeometry,
            leavesMaterial
        );

    leaves.position.y =
        10*scale;

    leaves.castShadow = true;

    group.add(leaves);


    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);
}


/* =========================================================
   ROCA
   ========================================================= */

function createRock(
    x,
    z,
    scale=1,
    color=0x777777
){

    const geometry =
        new THREE.DodecahedronGeometry(
            3*scale,
            0
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:1
        });

    const rock =
        new THREE.Mesh(
            geometry,
            material
        );

    rock.position.set(
        x,
        2*scale,
        z
    );

    rock.rotation.y =
        Math.random()*Math.PI;

    rock.castShadow = true;

    scene.add(rock);
}


/* =========================================================
   CACTUS
   ========================================================= */

function createCactus(
    x,
    z
){

    const group =
        new THREE.Group();


    const material =
        new THREE.MeshStandardMaterial({
            color:0x3b9b50
        });


    const body =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                1.5,
                1.8,
                9,
                8
            ),
            material
        );

    body.position.y=4.5;

    body.castShadow=true;

    group.add(body);


    const arm1 =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .9,
                1.1,
                4,
                8
            ),
            material
        );

    arm1.position.set(
        3,
        4.5,
        0
    );

    arm1.rotation.z =
        Math.PI/2;

    group.add(arm1);


    const arm2 =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .9,
                1.1,
                3.5,
                8
            ),
            material
        );

    arm2.position.set(
        -3,
        3.5,
        0
    );

    arm2.rotation.z =
        Math.PI/2;

    group.add(arm2);


    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);
}


/* =========================================================
   CRISTAL
   ========================================================= */

function createCrystal(
    x,
    z,
    color=0x7bdcff,
    scale=1
){

    const geometry =
        new THREE.OctahedronGeometry(
            3*scale,
            0
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:color,
            emissive:color,
            emissiveIntensity:.25
        });

    const crystal =
        new THREE.Mesh(
            geometry,
            material
        );

    crystal.position.set(
        x,
        3*scale,
        z
    );

    crystal.rotation.z =
        randomRange(-.3,.3);

    crystal.castShadow=true;

    scene.add(crystal);
}


/* =========================================================
   FLORES
   ========================================================= */

function createFlower(
    x,
    z
){

    const stem =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .12,
                .12,
                1.5,
                5
            ),
            new THREE.MeshStandardMaterial({
                color:0x308a3b
            })
        );

    stem.position.set(
        x,
        .75,
        z
    );

    scene.add(stem);


    const flower =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .65,
                6,
                6
            ),
            new THREE.MeshStandardMaterial({
                color:
                    Math.random()>.5
                    ?0xff5f8d
                    :0xffd34e
            })
        );

    flower.position.set(
        x,
        1.7,
        z
    );

    scene.add(flower);
}


/* =========================================================
   VOLCÁN
   ========================================================= */

function createVolcano(
    x,
    z
){

    const geometry =
        new THREE.ConeGeometry(
            18,
            26,
            12
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:0x4d2521
        });

    const volcano =
        new THREE.Mesh(
            geometry,
            material
        );

    volcano.position.set(
        x,
        13,
        z
    );

    volcano.castShadow=true;

    scene.add(volcano);


    const lava =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                5,
                5,
                .8,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0xff431f,
                emissive:0xff2600,
                emissiveIntensity:1
            })
        );

    lava.position.set(
        x,
        26,
        z
    );

    scene.add(lava);
}


/* =========================================================
   TEMPLO DIVINO
   ========================================================= */

function createDivineTemple(
    x,
    z
){

    const material =
        new THREE.MeshStandardMaterial({
            color:0xffdf75,
            emissive:0x8c641d,
            emissiveIntensity:.2
        });


    const base =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                45,
                3,
                35
            ),
            material
        );

    base.position.set(
        x,
        1.5,
        z
    );

    base.castShadow=true;

    scene.add(base);


    for(
        let i=-2;
        i<=2;
        i++
    ){

        const pillar =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    2.2,
                    2.2,
                    24,
                    10
                ),
                material
            );

        pillar.position.set(
            x + i*9,
            13,
            z
        );

        pillar.castShadow=true;

        scene.add(pillar);
    }


    const roof =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                29,
                18,
                4
            ),
            material
        );

    roof.position.set(
        x,
        32,
        z
    );

    roof.rotation.y =
        Math.PI/4;

    roof.castShadow=true;

    scene.add(roof);
}


/* =========================================================
   DECORAR ZONAS
   ========================================================= */

function decorateZone(
    index
){

    const centerZ =
        START_Z -
        index*ZONE_LENGTH -
        ZONE_LENGTH/2;


    /* PRADERA */

    if(index===0){

        for(
            let i=0;
            i<24;
            i++
        ){

            const x =
                randomRange(
                    -105,
                    105
                );

            const z =
                centerZ +
                randomRange(
                    -70,
                    70
                );

            if(Math.abs(x)<28)
                continue;

            createFlower(x,z);

            if(i%4===0)
                createTree(x,z+5,.8);
        }
    }


    /* BOSQUE */

    if(index===1){

        for(
            let i=0;
            i<34;
            i++
        ){

            const x =
                randomRange(
                    -105,
                    105
                );

            if(Math.abs(x)<25)
                continue;

            const z =
                centerZ +
                randomRange(
                    -75,
                    75
                );

            createTree(
                x,
                z,
                randomRange(.7,1.2)
            );
        }
    }


    /* DESIERTO */

    if(index===2){

        for(
            let i=0;
            i<24;
            i++
        ){

            const x =
                randomRange(
                    -105,
                    105
                );

            if(Math.abs(x)<25)
                continue;

            const z =
                centerZ +
                randomRange(
                    -75,
                    75
                );

            createCactus(
                x,
                z
            );
        }

        for(
            let i=0;
            i<15;
            i++
        ){

            createRock(
                randomRange(-105,105),
                centerZ+randomRange(-70,70),
                randomRange(.5,1.4),
                0xa47d48
            );
        }
    }


    /* HIELO */

    if(index===3){

        for(
            let i=0;
            i<25;
            i++
        ){

            const x =
                randomRange(
                    -105,
                    105
                );

            if(Math.abs(x)<25)
                continue;

            const z =
                centerZ+
                randomRange(-75,75);

            createCrystal(
                x,
                z,
                0xbcefff,
                randomRange(.7,1.5)
            );
        }
    }


    /* VOLCÁN */

    if(index===4){

        for(
            let i=0;
            i<6;
            i++
        ){

            const x =
                randomRange(-90,90);

            if(Math.abs(x)<28)
                continue;

            createVolcano(
                x,
                centerZ+
                randomRange(-65,65)
            );
        }

        for(
            let i=0;
            i<15;
            i++
        ){

            createRock(
                randomRange(-105,105),
                centerZ+randomRange(-70,70),
                randomRange(.5,1.2),
                0x36201e
            );
        }
    }


    /* ABISMO */

    if(index===5){

        for(
            let i=0;
            i<30;
            i++
        ){

            const x =
                randomRange(
                    -105,
                    105
                );

            if(Math.abs(x)<25)
                continue;

            const z =
                centerZ+
                randomRange(-75,75);

            createCrystal(
                x,
                z,
                0x208cff,
                randomRange(.5,1.2)
            );
        }
    }


    /* GALAXIA */

    if(index===6){

        for(
            let i=0;
            i<40;
            i++
        ){

            const x =
                randomRange(
                    -105,
                    105
                );

            if(Math.abs(x)<25)
                continue;

            const z =
                centerZ+
                randomRange(-75,75);

            createCrystal(
                x,
                z,
                Math.random()>.5
                ?0x8d6cff
                :0xff66ee,
                randomRange(.4,1.2)
            );
        }
    }


    /* SANTUARIO */

    if(index===7){

        for(
            let i=-4;
            i<=4;
            i++
        ){

            createCrystal(
                i*20,
                centerZ-40,
                0xd36cff,
                1.2
            );

            createCrystal(
                i*20,
                centerZ+40,
                0x7e63ff,
                1
            );
        }
    }


    /* DOMINIO DIVINO */

    if(index===8){

        createDivineTemple(
            0,
            centerZ-5
        );

        for(
            let i=0;
            i<20;
            i++
        ){

            createCrystal(
                randomRange(-105,105),
                centerZ+randomRange(-70,70),
                0xffe56b,
                randomRange(.5,1.2)
            );
        }
    }
}


for(
    let i=0;
    i<TOTAL_ZONES;
    i++
){
    decorateZone(i);
}


/* =========================================================
   CORRALES
   ========================================================= */

function createCorral(
    x,
    z,
    number
){

    const group =
        new THREE.Group();


    const floor =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                46,
                .4,
                40
            ),
            new THREE.MeshStandardMaterial({
                color:0xb89a68
            })

/* =========================================================
   TEXTO 3D
   ========================================================= */

function createTextSprite(
    text
){

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width=512;
    canvas.height=128;

    const ctx =
        canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle=
        "rgba(0,0,0,.65)";

    ctx.roundRect(
        10,
        10,
        492,
        108,
        25
    );

    ctx.fill();

    ctx.fillStyle="white";

    ctx.font=
        "bold 50px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
        text,
        256,
        64
    );

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    const material =
        new THREE.SpriteMaterial({
            map:texture,
            transparent:true
        });

    return new THREE.Sprite(
        material
    );
}

/* =========================================================
   MOVIMIENTO
   ========================================================= */

const keys={};

document.addEventListener(
    "keydown",
    function(event){

        keys[event.code]=true;

        if(
            event.code==="Space" &&
            player.position.y<=0.05
        ){
            playerVelocityY=.55;
        }
    }
);


document.addEventListener(
    "keyup",
    function(event){
        keys[event.code]=false;
    }
);


let playerVelocityY=0;

const gravity=-0.025;

const normalSpeed=.32;

const sprintSpeed=.55;


/* =========================================================
   CÁMARA CON MOUSE
   ========================================================= */

let cameraYaw=0;

let cameraPitch=.35;


/*
    La cámara responde al movimiento
    del mouse sin usar pointer lock.
*/

document.addEventListener(
    "mousemove",
    function(event){

        if(
            !gameStarted
        ){
            return;
        }

        cameraYaw -=
            event.movementX *
            0.003;

        cameraPitch -=
            event.movementY *
            0.002;

        cameraPitch =
            Math.max(
                -0.25,
                Math.min(
                    .95,
                    cameraPitch
                )
            );
    }
);


/* =========================================================
   ACTUALIZAR CÁMARA
   ========================================================= */

function updateCamera(){

    const distance=34;

    const horizontalDistance =
        Math.cos(cameraPitch) *
        distance;


    const cameraX =
        player.position.x -
        Math.sin(cameraYaw) *
        horizontalDistance;


    const cameraY =
        player.position.y +
        10 +
        Math.sin(cameraPitch) *
        distance;


    const cameraZ =
        player.position.z +
        Math.cos(cameraYaw) *
        horizontalDistance;


    const targetPosition =
        new THREE.Vector3(
            cameraX,
            cameraY,
            cameraZ
        );


    camera.position.lerp(
        targetPosition,
        .12
    );


    const target =
        new THREE.Vector3(
            player.position.x,
            player.position.y+5,
            player.position.z
        );


    camera.lookAt(
        target
    );
}


/* =========================================================
   MOVIMIENTO DEL JUGADOR
   ========================================================= */

function updatePlayer(){

    if(!gameStarted)
        return;


    let speed =
        keys["ShiftLeft"] ||
        keys["ShiftRight"]
        ? sprintSpeed
        : normalSpeed;


    let moveX=0;
    let moveZ=0;


    if(keys["KeyW"])
        moveZ-=1;

    if(keys["KeyS"])
        moveZ+=1;

    if(keys["KeyA"])
        moveX-=1;

    if(keys["KeyD"])
        moveX+=1;


    const length =
        Math.sqrt(
            moveX*moveX+
            moveZ*moveZ
        );


    if(length>0){

        moveX/=length;
        moveZ/=length;


        const forwardX =
            -Math.sin(cameraYaw);

        const forwardZ =
            -Math.cos(cameraYaw);


        const rightX =
            Math.cos(cameraYaw);

        const rightZ =
            -Math.sin(cameraYaw);


        player.position.x +=
            (
                forwardX*moveZ+
                rightX*moveX
            ) * speed;


        player.position.z +=
            (
                forwardZ*moveZ+
                rightZ*moveX
            ) * speed;


        player.rotation.y =
            Math.atan2(
                moveX,
                moveZ
            ) +
            cameraYaw;
    }


    /* gravedad */

    playerVelocityY +=
        gravity;

    player.position.y +=
        playerVelocityY;


    if(
        player.position.y<0
    ){

        player.position.y=0;

        playerVelocityY=0;
    }


    /* límites exteriores */

    const limitX =
        MAP_WIDTH/2-12;

    const limitStart =
        START_Z+30;

    const limitEnd =
        END_Z-30;


    player.position.x =
        Math.max(
            -limitX,
            Math.min(
                limitX,
                player.position.x
            )
        );


    player.position.z =
        Math.max(
            limitEnd,
            Math.min(
                limitStart,
                player.position.z
            )
        );
}


/* =========================================================
   ZONA ACTUAL
   ========================================================= */

function updateZone(){

    const distanceFromStart =
        START_Z -
        player.position.z;


    let index =
        Math.floor(
            distanceFromStart /
            ZONE_LENGTH
        );


    index =
        Math.max(
            0,
            Math.min(
                TOTAL_ZONES-1,
                index
            )
        );


    document.getElementById(
        "zone"
    ).textContent=
        zones[index].name;
}

}

    function(){

        camera.aspect=
            window.innerWidth /

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================================================
   LOOP PRINCIPAL
   ========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    updatePlayer();

    updateCamera();

    updateZone();

    animateObjects();


    renderer.render(
        scene,
        camera
    );
}
