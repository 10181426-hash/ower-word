<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OWNER WORLD V0.7</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
}

canvas{
  display:block;
}

#startScreen{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:
    radial-gradient(circle at center,#17234c 0%,#080b19 45%,#020207 100%);
  color:white;
}

#startScreen h1{
  font-size:64px;
  letter-spacing:5px;
  text-shadow:
    0 0 10px #8c5cff,
    0 0 30px #5b38ff,
    0 0 70px #8c5cff;
}

#startScreen h2{
  margin-top:5px;
  color:#bca8ff;
  letter-spacing:8px;
}

#version{
  margin:18px;
  color:#ffffff;
  font-size:20px;
  opacity:.8;
}

#nameInput{
  width:300px;
  padding:15px;
  border-radius:12px;
  border:2px solid #7655ff;
  background:#0d1022;
  color:white;
  outline:none;
  text-align:center;
  font-size:18px;
}

#playButton{
  margin-top:18px;
  padding:15px 50px;
  border:0;
  border-radius:14px;
  color:white;
  background:linear-gradient(90deg,#5b35ff,#a35cff);
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 25px #6948ff;
}

#playButton:hover{
  transform:scale(1.05);
}

#hud{
  position:fixed;
  top:15px;
  left:15px;
  z-index:20;
  color:white;
  background:rgba(0,0,0,.38);
  border:1px solid rgba(255,255,255,.2);
  border-radius:12px;
  padding:12px 16px;
  backdrop-filter:blur(5px);
}

#zoneName{
  font-size:18px;
  font-weight:bold;
}

#money{
  margin-top:5px;
  color:#ffd75a;
  font-size:18px;
}

#speed{
  margin-top:5px;
  color:#9bd7ff;
}

#interaction{
  position:fixed;
  left:50%;
  bottom:55px;
  transform:translateX(-50%);
  z-index:30;
  display:none;
  width:330px;
  text-align:center;
  color:white;
}

#interactionText{
  margin-bottom:8px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

#progressOuter{
  width:100%;
  height:20px;
  background:#161616;
  border:2px solid white;
  border-radius:20px;
  overflow:hidden;
}

#progressInner{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#7b4dff,#d6b2ff);
  transition:width .05s linear;
}

#rarityResult{
  margin-top:10px;
  font-size:22px;
  font-weight:bold;
  text-shadow:0 0 15px currentColor;
}

#announcement{
  position:fixed;
  top:90px;
  left:50%;
  transform:translateX(-50%);
  z-index:40;
  display:none;
  min-width:400px;
  padding:18px 30px;
  border-radius:14px;
  text-align:center;
  color:white;
  background:rgba(15,8,35,.88);
  border:2px solid #b98cff;
  box-shadow:0 0 35px #754cff;
  font-weight:bold;
  font-size:20px;
}

#adminButton{
  position:fixed;
  right:15px;
  top:15px;
  z-index:50;
  display:none;
  border:1px solid #b58cff;
  background:rgba(25,12,60,.9);
  color:white;
  padding:12px 18px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

#adminPanel{
  position:fixed;
  right:15px;
  top:65px;
  z-index:60;
  display:none;
  width:330px;
  max-height:85vh;
  overflow:auto;
  padding:18px;
  border-radius:18px;
  color:white;
  background:rgba(12,8,30,.96);
  border:2px solid #8b5cff;
  box-shadow:0 0 35px #5d38ff;
}

#adminPanel h2{
  text-align:center;
  margin-bottom:12px;
  color:#d7c2ff;
}

.adminSection{
  margin-top:15px;
  padding-top:12px;
  border-top:1px solid rgba(255,255,255,.15);
}

.adminPanel input,
.adminPanel select,
.adminPanel button,
#adminPanel input,
#adminPanel select,
#adminPanel button{
  width:100%;
  margin-top:7px;
  padding:9px;
  border-radius:9px;
  border:1px solid #7452d8;
  background:#17132b;
  color:white;
}

#adminPanel button{
  cursor:pointer;
  font-weight:bold;
}

.scope{
  display:flex;
  gap:6px;
}

.scope button{
  flex:1;
}

#bossInfo{
  font-size:13px;
  color:#bdb4d9;
  margin-top:6px;
}

#adminMessage{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:55;
  color:white;
  font-weight:bold;
  font-size:21px;
  display:none;
  text-shadow:0 2px 5px black;
  pointer-events:none;
}

#ownerTag{
  position:absolute;
  color:white;
  font-weight:bold;
  text-shadow:
    0 0 5px #9a6cff,
    0 0 15px #6d38ff;
  pointer-events:none;
  transform:translate(-50%,-100%);
  z-index:10;
}
</style>
</head>

<body>

<div id="startScreen">
  <h1>OWNER WORLD</h1>
  <h2>🌌 ORIGINAL WORLD 🌌</h2>
  <div id="version">V0.7</div>

  <input id="nameInput"
         maxlength="16"
         placeholder="Escribe tu nombre">

  <button id="playButton">JUGAR</button>
</div>

<div id="hud">
  <div id="zoneName">🌿 Pradera Inicial</div>
  <div id="money">💰 $0</div>
  <div id="speed">👟 ⚡ 10</div>
</div>

<div id="interaction">
  <div id="interactionText">🥚 Mantén E para recoger</div>

  <div id="progressOuter">
    <div id="progressInner"></div>
  </div>

  <div id="rarityResult"></div>
</div>

<div id="announcement"></div>

<div id="adminMessage">ADMIN</div>

<button id="adminButton">👑 ADMIN</button>

<div id="adminPanel">
  <h2>🌌 👑 ADMIN 👑 🌌</h2>

  <div class="adminSection">
    <b>Ámbito</b>

    <div class="scope">
      <button id="globalScope">🌎 GLOBAL</button>
      <button id="serverScope">🖥️ SERVIDOR</button>
    </div>
  </div>

  <div class="adminSection">
    <b>📢 Mensaje</b>
    <input id="messageInput" placeholder="Mensaje para jugadores">
    <button id="sendMessage">ENVIAR MENSAJE</button>
  </div>

  <div class="adminSection">
    <b>🌌 Eventos</b>
    <button id="galaxyEvent">🌌 ACTIVAR EVENTO GALAXY</button>
  </div>

  <div class="adminSection">
    <b>🥚 GENERAR HUEVO</b>

    <select id="eggZone">
      <option value="0">🌿 Pradera Inicial</option>
      <option value="1">🌲 Bosque Encantado</option>
      <option value="2">🏜️ Desierto Dorado</option>
      <option value="3">❄️ Cumbres Heladas</option>
      <option value="4">🌋 Volcán Carmesí</option>
      <option value="5">🌊 Abismo Marino</option>
      <option value="6">🌌 Galaxia Perdida</option>
      <option value="7">♾️ Santuario Eterno</option>
      <option value="8">✨ Dominio Divino</option>
    </select>

    <select id="eggRarity">
      <option>Común</option>
      <option>Raro</option>
      <option>Épico</option>
      <option>Legendario</option>
      <option>Cósmico</option>
      <option>Secreto</option>
      <option>Eterno</option>
      <option>Divino</option>
    </select>

    <button id="spawnEgg">🥚 SPAWNEAR HUEVO</button>
  </div>

  <div class="adminSection">
    <b>📊 Encuesta</b>
    <input id="pollInput" placeholder="Pregunta">
    <button id="sendPoll">CREAR ENCUESTA</button>
  </div>

  <div class="adminSection">
    <b>👹 JEFES</b>
    <div id="bossInfo">
      Los jefes están colocados físicamente
      en sus respectivas zonas.
    </div>
  </div>
</div>

<div id="ownerTag">👑 OWNER 👑</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   OWNER WORLD V0.7
========================================================= */

const VERSION = "V0.7";

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x82cfff);

scene.fog = new THREE.Fog(
  0x82cfff,
  180,
  900
);

const camera = new THREE.PerspectiveCamera(
  70,
  innerWidth / innerHeight,
  0.1,
  1500
);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

document.body.appendChild(renderer.domElement);


/* =========================================================
   LIGHT
========================================================= */

const hemi = new THREE.HemisphereLight(
  0xffffff,
  0x39422e,
  1.5
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
  0xffffff,
  2
);

sun.position.set(
  100,
  250,
  100
);

sun.castShadow = true;

scene.add(sun);


/* =========================================================
   MAP
========================================================= */

const MAP_WIDTH = 280;
const ZONE_LENGTH = 150;
const START_Z = 100;

const zones = [
  {
    name:"🌿 Pradera Inicial",
    color:0x69b84b,
    ground:0x69b84b
  },
  {
    name:"🌲 Bosque Encantado",
    color:0x2e7139,
    ground:0x315f32
  },
  {
    name:"🏜️ Desierto Dorado",
    color:0xd9ae55,
    ground:0xd9ae55
  },
  {
    name:"❄️ Cumbres Heladas",
    color:0xb8e7f7,
    ground:0xb8e7f7
  },
  {
    name:"🌋 Volcán Carmesí",
    color:0x6d2525,
    ground:0x482426
  },
  {
    name:"🌊 Abismo Marino",
    color:0x176c91,
    ground:0x145a76
  },
  {
    name:"🌌 Galaxia Perdida",
    color:0x30235f,
    ground:0x211845
  },
  {
    name:"♾️ Santuario Eterno",
    color:0x613d87,
    ground:0x4b3269
  },
  {
    name:"✨ Dominio Divino",
    color:0xc9a532,
    ground:0xa98b31
  }
];


/* =========================================================
   GROUND ZONES
========================================================= */

const groundGroup = new THREE.Group();

scene.add(groundGroup);

zones.forEach((zone,i)=>{

  const z =
    START_Z -
    ZONE_LENGTH * i -
    ZONE_LENGTH/2;

  const geometry =
    new THREE.BoxGeometry(
      MAP_WIDTH,
      4,
      ZONE_LENGTH
    );

  const material =
    new THREE.MeshStandardMaterial({
      color:zone.ground,
      roughness:.95
    });

  const ground =
    new THREE.Mesh(
      geometry,
      material
    );

  ground.position.set(
    0,
    -2,
    z
  );

  groundGroup.add(ground);

});


/* =========================================================
   OUTER WALLS
========================================================= */

function createWall(x,z,length,color){

  const wall =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        8,
        38,
        length
      ),
      new THREE.MeshStandardMaterial({
        color:color,
        roughness:1
      })
    );

  wall.position.set(
    x,
    19,
    z
  );

  scene.add(wall);

  const grass =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        10,
        2,
        length
      ),
      new THREE.MeshStandardMaterial({
        color:0x3f7b35
      })
    );

  grass.position.set(
    x,
    38,
    z
  );

  scene.add(grass);
}

createWall(
  -144,
  -575,
  1450,
  0x705437
);

createWall(
  144,
  -575,
  1450,
  0x705437
);

createWall(
  0,
  151,
  288,
  0x705437
);

createWall(
  0,
  -1301,
  288,
  0x705437
);


/* =========================================================
   CORRALS
========================================================= */

const corralXs = [
  -90,
  -30,
  30,
  90
];

const corrals = [];

corralXs.forEach((x,i)=>{

  const floor =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        48,
        1,
        44
      ),
      new THREE.MeshStandardMaterial({
        color:0x79a94c
      })
    );

  floor.position.set(
    x,
    .5,
    45
  );

  scene.add(floor);

  const sign =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2,
        7,
        2
      ),
      new THREE.MeshStandardMaterial({
        color:0x8b5a32
      })
    );

  sign.position.set(
    x,
    4,
    25
  );

  scene.add(sign);

  corrals.push({
    x,
    z:45,
    claimed:false
  });

});


/* =========================================================
   TREADMILLS OUTSIDE CORRALS
========================================================= */

const treadmills = [];

corrals.forEach((corral)=>{

  const base =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        15,
        1,
        7
      ),
      new THREE.MeshStandardMaterial({
        color:0x222633,
        metalness:.4
      })
    );

  base.position.set(
    corral.x,
    1,
    14
  );

  scene.add(base);

  const belt =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        13,
        .35,
        5
      ),
      new THREE.MeshStandardMaterial({
        color:0x111111
      })
    );

  belt.position.set(
    corral.x,
    1.7,
    14
  );

  scene.add(belt);

  treadmills.push({
    x:corral.x,
    z:14
  });

});


/* =========================================================
   DECORATIONS
========================================================= */

function tree(x,z,scale=1){

  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        1.5*scale,
        2*scale,
        8*scale,
        8
      ),
      new THREE.MeshStandardMaterial({
        color:0x69452b
      })
    );

  trunk.position.set(
    x,
    4*scale,
    z
  );

  scene.add(trunk);

  const leaves =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        6*scale,
        12*scale,
        8
      ),
      new THREE.MeshStandardMaterial({
        color:0x267239
      })
    );

  leaves.position.set(
    x,
    11*scale,
    z
  );

  scene.add(leaves);
}


function cactus(x,z){

  const c =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        1.5,
        2,
        9,
        8
      ),
      new THREE.MeshStandardMaterial({
        color:0x3b8d42
      })
    );

  c.position.set(
    x,
    4.5,
    z
  );

  scene.add(c);

  const arm =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        4,
        1.5,
        1.5
      ),
      new THREE.MeshStandardMaterial({
        color:0x3b8d42
      })
    );

  arm.position.set(
    x+2,
    5,
    z
  );

  scene.add(arm);
}


function crystal(x,z,color){

  const c =
    new THREE.Mesh(
      new THREE.OctahedronGeometry(3,0),
      new THREE.MeshStandardMaterial({
        color,
        emissive:color,
        emissiveIntensity:.7
      })
    );

  c.position.set(
    x,
    3,
    z
  );

  scene.add(c);
}


function rock(x,z,color=0x555555){

  const r =
    new THREE.Mesh(
      new THREE.DodecahedronGeometry(
        3+Math.random()*2
      ),
      new THREE.MeshStandardMaterial({
        color
      })
    );

  r.position.set(
    x,
    2,
    z
  );

  scene.add(r);
}


/* =========================================================
   ZONE DECOR
========================================================= */

for(let i=0;i<9;i++){

  const center =
    START_Z -
    ZONE_LENGTH*i -
    ZONE_LENGTH/2;

  for(let j=0;j<12;j++){

    const x =
      -115 +
      Math.random()*230;

    const z =
      center -
      ZONE_LENGTH/2 +
      Math.random()*ZONE_LENGTH;

    if(Math.abs(x)<105 && Math.abs(z-45)<35 && i===0)
      continue;

    if(i===0){
      tree(x,z,.7+Math.random()*.4);
    }

    if(i===1){
      tree(x,z,1+Math.random()*.6);
      tree(x+7,z+5,.7);
    }

    if(i===2){
      cactus(x,z);
      rock(x+8,z+5,0xb48c48);
    }

    if(i===3){
      crystal(x,z,0xbdefff);
      rock(x+8,z+5,0x9fc4d0);
    }

    if(i===4){
      rock(x,z,0x252525);
      crystal(x+7,z+3,0xff3d2e);
    }

    if(i===5){
      crystal(x,z,0x19bfff);
      rock(x+8,z+4,0x174b64);
    }

    if(i===6){
      crystal(x,z,0x9b5cff);
      crystal(x+8,z+3,0xff4ccf);
    }

    if(i===7){
      crystal(x,z,0x9c6cff);
      crystal(x+8,z+5,0xd8a7ff);
    }

    if(i===8){
      crystal(x,z,0xffdc56);
      crystal(x+8,z+4,0xffffff);
    }
  }
}


/* =========================================================
   PLAYER
========================================================= */

const player =
  new THREE.Group();

const body =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      4,
      6,
      3
    ),
    new THREE.MeshStandardMaterial({
      color:0x315dff
    })
  );

body.position.y=4;

player.add(body);

const head =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      4.5,
      4.5,
      4.5
    ),
    new THREE.MeshStandardMaterial({
      color:0xffc99c
    })
  );

head.position.y=9.5;

player.add(head);

player.position.set(
  0,
  0,
  80
);

scene.add(player);


/* =========================================================
   OWNER TAG
========================================================= */

const ownerTag =
  document.getElementById("ownerTag");

let playerName="";

function updateOwnerTag(){

  if(playerName.toUpperCase()==="ERICK"){

    const pos =
      player.position.clone();

    pos.y += 15;

    pos.project(camera);

    ownerTag.style.left =
      ((pos.x+1)/2*innerWidth)+"px";

    ownerTag.style.top =
      ((-pos.y+1)/2*innerHeight)+"px";

    ownerTag.style.display="block";

  }else{

    ownerTag.style.display="none";

  }
}


/* =========================================================
   MOVEMENT
========================================================= */

const keys={};

document.addEventListener(
  "keydown",
  e=>{
    keys[e.code]=true;

    if(e.code==="Space" &&
       player.position.y<=.1){

      velocityY=.65;
    }
  }
);

document.addEventListener(
  "keyup",
  e=>{
    keys[e.code]=false;
  }
);

let velocityY=0;

let speed=10;

function updateMovement(){

  const moveSpeed =
    keys.ShiftLeft || keys.ShiftRight
      ? .65
      : .42;

  if(keys.KeyW) player.position.z -= moveSpeed;
  if(keys.KeyS) player.position.z += moveSpeed;
  if(keys.KeyA) player.position.x -= moveSpeed;
  if(keys.KeyD) player.position.x += moveSpeed;

  velocityY-=.035;

  player.position.y+=velocityY;

  if(player.position.y<0){

    player.position.y=0;
    velocityY=0;
  }

  player.position.x =
    THREE.MathUtils.clamp(
      player.position.x,
      -135,
      135
    );

  player.position.z =
    THREE.MathUtils.clamp(
      player.position.z,
      -1290,
      135
    );
}


/* =========================================================
   MOUSE CAMERA
========================================================= */

let cameraYaw=0;
let cameraPitch=.35;

document.addEventListener(
  "mousemove",
  e=>{

    cameraYaw -=
      e.movementX*.0025;

    cameraPitch -=
      e.movementY*.002;

    cameraPitch =
      THREE.MathUtils.clamp(
        cameraPitch,
        -.15,
        .9
      );
  }
);

function updateCamera(){

  const distance=38;

  const horizontal =
    Math.cos(cameraPitch)*distance;

  const x =
    player.position.x -
    Math.sin(cameraYaw)*horizontal;

  const y =
    player.position.y+
    12+
    Math.sin(cameraPitch)*distance;

  const z =
    player.position.z+
    Math.cos(cameraYaw)*horizontal;

  camera.position.lerp(
    new THREE.Vector3(x,y,z),
    .12
  );

  camera.lookAt(
    player.position.x,
    player.position.y+5,
    player.position.z
  );
}


/* =========================================================
   ZONE HUD
========================================================= */

function getZone(){

  const index =
    Math.floor(
      (START_Z-player.position.z)/
      ZONE_LENGTH
    );

  return THREE.MathUtils.clamp(
    index,
    0,
    8
  );
}

function updateZone(){

  const index=getZone();

  document.getElementById("zoneName")
    .textContent=zones[index].name;
}


/* =========================================================
   MONEY
========================================================= */

let money=0;

function addMoney(amount){

  money+=amount;

  document.getElementById("money")
    .textContent=
    "💰 $"+money.toLocaleString();
}


/* =========================================================
   EGG SYSTEM
========================================================= */

const rarities=[
  "Común",
  "Raro",
  "Épico",
  "Legendario",
  "Cósmico",
  "Secreto",
  "Eterno",
  "Divino"
];

const rarityColors=[
  0xffffff,
  0x4da6ff,
  0xb65cff,
  0xffd52e,
  0x55eaff,
  0xff39e8,
  0xff6539,
  0xffffff
];

const rarityMoney=[
  50,
  150,
  500,
  2000,
  10000,
  50000,
  250000,
  1000000
];

const eggs=[];

function createEgg(zoneIndex,rarityIndex){

  const zone =
    zones[zoneIndex];

  const z =
    START_Z-
    zoneIndex*ZONE_LENGTH-
    70;

  const x =
    -100+
    Math.random()*200;

  const group =
    new THREE.Group();

  const color =
    rarityColors[rarityIndex];

  let geometry;

  if(rarityIndex<4){

    geometry =
      new THREE.SphereGeometry(
        2.8,
        16,
        12
      );

  }else{

    geometry =
      new THREE.OctahedronGeometry(
        3.5,
        1
      );
  }

  const mat =
    new THREE.MeshStandardMaterial({
      color,
      emissive:color,
      emissiveIntensity:
        rarityIndex>=4?.8:.15,
      roughness:.3
    });

  const egg =
    new THREE.Mesh(
      geometry,
      mat
    );

  egg.scale.y=1.25;

  group.add(egg);

  /* diseño según zona */

  const zoneRing =
    new THREE.Mesh(
      new THREE.TorusGeometry(
        4,
        .25,
        8,
        24
      ),
      new THREE.MeshStandardMaterial({
        color:zone.color,
        emissive:zone.color,
        emissiveIntensity:.7
      })
    );

  zoneRing.rotation.x=Math.PI/2;

  group.add(zoneRing);


  /* PARTICULAS SECRET+ */

  if(rarityIndex>=5){

    const particleGeometry =
      new THREE.BufferGeometry();

    const positions=[];

    for(let p=0;p<70;p++){

      positions.push(
        (Math.random()-.5)*12,
        (Math.random()-.5)*12,
        (Math.random()-.5)*12
      );
    }

    particleGeometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(
        positions,
        3
      )
    );

    const particleMaterial =
      new THREE.PointsMaterial({
        color,
        size:.35,
        transparent:true,
        opacity:.9
      });

    const particles =
      new THREE.Points(
        particleGeometry,
        particleMaterial
      );

    group.add(particles);

  }


  group.position.set(
    x,
    4,
    z
  );

  scene.add(group);

  const data={
    group,
    zoneIndex,
    rarityIndex,
    collected:false,
    particles:null
  };

  eggs.push(data);

  if(rarityIndex>=4){

    announceEgg(
      zone.name,
      rarities[rarityIndex]
    );
  }

  return data;
}


/* =========================================================
   RANDOM INITIAL EGGS
========================================================= */

function randomRarity(){

  const r=Math.random();

  if(r<.48) return 0;
  if(r<.72) return 1;
  if(r<.87) return 2;
  if(r<.95) return 3;
  if(r<.98) return 4;
  if(r<.993) return 5;
  if(r<.998) return 6;

  return 7;
}

for(let i=0;i<9;i++){

  createEgg(
    i,
    randomRarity()
  );
}


/* =========================================================
   EGG INTERACTION
========================================================= */

let nearbyEgg=null;
let holdingE=false;
let eggProgress=0;

const interaction =
  document.getElementById("interaction");

const progressInner =
  document.getElementById("progressInner");

const rarityResult =
  document.getElementById("rarityResult");

document.addEventListener(
  "keydown",
  e=>{

    if(e.code==="KeyE"){

      holdingE=true;
    }
  }
);

document.addEventListener(
  "keyup",
  e=>{

    if(e.code==="KeyE"){

      holdingE=false;
      eggProgress=0;
    }
  }
);


function findNearbyEgg(){

  nearbyEgg=null;

  let best=7;

  eggs.forEach(egg=>{

    if(egg.collected)return;

    const distance =
      player.position.distanceTo(
        egg.group.position
      );

    if(distance<best){

      best=distance;
      nearbyEgg=egg;
    }
  });

}


function updateEggInteraction(){

  findNearbyEgg();

  if(!nearbyEgg){

    interaction.style.display="none";
    return;
  }

  interaction.style.display="block";

  if(holdingE){

    eggProgress+=.018;

    progressInner.style.width =
      Math.min(
        100,
        eggProgress*100
      )+"%";

    document.getElementById(
      "interactionText"
    ).textContent=
      "🥚 Abriendo huevo...";

    if(eggProgress>=1){

      collectEgg(nearbyEgg);

      holdingE=false;
      eggProgress=0;
    }

  }else{

    document.getElementById(
      "interactionText"
    ).textContent=
      "🥚 Mantén E para recoger";

    progressInner.style.width="0%";
  }
}


function collectEgg(egg){

  egg.collected=true;

  egg.group.visible=false;

  const rarity =
    rarities[egg.rarityIndex];

  rarityResult.textContent =
    "✨ "+rarity+" ✨";

  rarityResult.style.color =
    "#"+
    rarityColors[
      egg.rarityIndex
    ].toString(16).padStart(6,"0");

  addMoney(
    rarityMoney[
      egg.rarityIndex
    ]
  );

  setTimeout(()=>{

    rarityResult.textContent="";

  },3000);
}

/* =========================================================
   PIANO PERMANENTE
========================================================= */

let audioContext=null;
let pianoTimer=null;

function startPiano(){

  if(audioContext)return;

  audioContext=
    new (window.AudioContext ||
    window.webkitAudioContext)();

  const notes=[
    261.63,
    329.63,
    392.00,
    523.25,
    392.00,
    329.63
  ];

  let index=0;

  pianoTimer=
    setInterval(()=>{

      if(!audioContext)return;

      const osc=
        audioContext.createOscillator();

      const gain=
        audioContext.createGain();

      osc.type="sine";

      osc.frequency.value=
        notes[index%notes.length];

      gain.gain.setValueAtTime(
        .0001,
        audioContext.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        .035,
        audioContext.currentTime+.03
      );

      gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioContext.currentTime+.9
      );

      osc.connect(gain);
      gain.connect(
        audioContext.destination
      );

      osc.start();

      osc.stop(
        audioContext.currentTime+1
      );

      index++;

    },950);
}


/* =========================================================
   GALAXY EPIC MUSIC
========================================================= */

let galaxyActive=false;
let galaxyTimer=null;

function galaxyMusic(){

  if(!audioContext)return;

  const notes=[
    196,
    246.94,
    293.66,
    392,
    493.88,
    587.33,
    783.99
  ];

  let i=0;

  galaxyTimer=
    setInterval(()=>{

      if(!galaxyActive)return;

      const osc=
        audioContext.createOscillator();

      const gain=
        audioContext.createGain();

      osc.type="triangle";

      osc.frequency.value=
        notes[i%notes.length];

      gain.gain.setValueAtTime(
        .0001,
        audioContext.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        .08,
        audioContext.currentTime+.08
      );

      gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioContext.currentTime+1.4
      );

      osc.connect(gain);
      gain.connect(
        audioContext.destination
      );

      osc.start();

      osc.stop(
        audioContext.currentTime+1.5
      );

      i++;

    },450);
}

/* =========================================================
   ANIMATION
========================================================= */

const clock=
  new THREE.Clock();

function animate(){

  requestAnimationFrame(
    animate
  );

  const t=
    clock.getElapsedTime();

  updateMovement();
  updateCamera();
  updateZone();
  updateEggInteraction();
  updateOwnerTag();

  /* animación huevos */

  eggs.forEach(egg=>{

    if(egg.collected)return;

    egg.group.rotation.y+=.01;

    egg.group.position.y=
      4+
      Math.sin(
        t*2+
        egg.group.position.x
      )*.25;
  });


  /* animación jefes */

  bosses.forEach((boss,i)=>{

    boss.position.y=
      9+
      Math.sin(
        t*1.5+i
      )*.5;

    boss.rotation.y=
      Math.sin(
        t*.5+i
      )*.15;
  });


  renderer.render(
    scene,
    camera
  );
}

animate();
