<body>

<div id="startScreen">
    <h1>OWNER WORLD</h1>
    <p>El comienzo de un mundo enorme 👑</p>

</div>

<div id="hud">
    <h1>👑 OWNER WORLD</h1>
    <div>💰 Dinero: <span id="money">0</span></div>
    <div>📍 Zona: <span id="zone">Pradera Inicial</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
/* =========================================================
   OWNER WORLD V0.3
   MAPA + ZONAS + CORRALES + MUROS + SALTO + CÁMARA
   ========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 180, 1100);

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    2200
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

/* =========================================================
   LUCES
   ========================================================= */

const hemiLight = new THREE.HemisphereLight(
    0xffffff,
    0x445566,
    2
);

scene.add(hemiLight);

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(100, 200, 100);
scene.add(sun);

/* =========================================================
   MAPA
   ========================================================= */

const map = new THREE.Group();
scene.add(map);

/* =========================================================
   TERRENO
   ========================================================= */

const MAP_WIDTH = 260;
const MAP_LENGTH = 1250;

const ground = new THREE.Mesh(
    new THREE.BoxGeometry(MAP_WIDTH, 2, MAP_LENGTH),
    new THREE.MeshStandardMaterial({
        color: 0x4c8f45
    })
);

ground.position.set(0, -1, -430);
map.add(ground);

/* =========================================================
   CAMINO CENTRAL
   ========================================================= */

const road = new THREE.Mesh(
    new THREE.BoxGeometry(34, 0.4, 1150),
    new THREE.MeshStandardMaterial({
        color: 0x555555
    })
);

road.position.set(0, 0.2, -430);
map.add(road);

/* =========================================================
   ZONAS
   Ahora son un poco más largas.
   ========================================================= */

const zones = [
    {
        name: "🌿 Pradera Inicial",
        z: 0,
        length: 115,
        color: 0x63b84d
    },
    {
        name: "🌲 Bosque Encantado",
        z: -135,
        length: 115,
        color: 0x286b3b
    },
    {
        name: "🏜️ Desierto Dorado",
        z: -270,
        length: 115,
        color: 0xd7a842
    },
    {
        name: "❄️ Cumbres Heladas",
        z: -405,
        length: 115,
        color: 0xbde8ff
    },
    {
        name: "🌋 Volcán Carmesí",
        z: -540,
        length: 115,
        color: 0x8f2929
    },
    {
        name: "🌊 Abismo Marino",
        z: -675,
        length: 115,
        color: 0x176b91
    },
    {
        name: "🌌 Galaxia Perdida",
        z: -810,
        length: 115,
        color: 0x352060
    },
    {
        name: "♾️ Santuario Eterno",
        z: -945,
        length: 115,
        color: 0x725ca8
    },
    {
        name: "✨ Dominio Divino",
        z: -1080,
        length: 115,
        color: 0xd9c875
    }
];

/* =========================================================
   CREAR ZONAS
   ========================================================= */

function createZone(zone) {

    const platform = new THREE.Mesh(
        new THREE.BoxGeometry(
            220,
            0.5,
            zone.length
        ),
        new THREE.MeshStandardMaterial({
            color: zone.color
        })
    );

    platform.position.set(0, 0.5, zone.z);
    map.add(platform);

    const gate = new THREE.Mesh(
        new THREE.BoxGeometry(65, 18, 3),
        new THREE.MeshStandardMaterial({
            color: zone.color,
            emissive: zone.color,
            emissiveIntensity: 0.15
        })
    );

    gate.position.set(
        0,
        9,
        zone.z - zone.length / 2
    );

    map.add(gate);
}

zones.forEach(createZone);

/* =========================================================
   MUROS ALREDEDOR DEL MAPA
   SOLO AQUÍ.
   ========================================================= */

const wallMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x30343b
    });

/* Muro izquierdo */

const leftWall = new THREE.Mesh(
    new THREE.BoxGeometry(5, 35, MAP_LENGTH + 40),
    wallMaterial
);

leftWall.position.set(
    -MAP_WIDTH / 2,
    17.5,
    -430
);

map.add(leftWall);

/* Muro derecho */

const rightWall = new THREE.Mesh(
    new THREE.BoxGeometry(5, 35, MAP_LENGTH + 40),
    wallMaterial
);

rightWall.position.set(
    MAP_WIDTH / 2,
    17.5,
    -430
);

map.add(rightWall);

/* Muro final */

const endWall = new THREE.Mesh(
    new THREE.BoxGeometry(MAP_WIDTH + 10, 35, 5),
    wallMaterial
);

endWall.position.set(
    0,
    17.5,
    -1085
);

map.add(endWall);

/* Muro inicial */

const startWall = new THREE.Mesh(
    new THREE.BoxGeometry(MAP_WIDTH + 10, 35, 5),
    wallMaterial
);

startWall.position.set(
    0,
    17.5,
    90
);

map.add(startWall);

/* =========================================================
   CORRALES
   4 bases en una sola línea.
   SIN MUROS.
   ========================================================= */

const basePositions = [
    -90,
    -30,
    30,
    90
];

function createCorral(x, number) {

    const floor = new THREE.Mesh(
        new THREE.BoxGeometry(48, 2, 40),
        new THREE.MeshStandardMaterial({
            color: 0xc99a5a
        })
    );

    floor.position.set(x, 1, 45);
    map.add(floor);

    /* Poste decorativo */

    const postMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x754c24
        });

    const postPositions = [
        [-20, -15],
        [20, -15],
        [-20, 15],
        [20, 15]
    ];

    postPositions.forEach(([px, pz]) => {

        const post = new THREE.Mesh(
            new THREE.BoxGeometry(2, 7, 2),
            postMaterial
        );

        post.position.set(
            x + px,
            4.5,
            45 + pz
        );

        map.add(post);
    });

    const label = createTextSprite(
        "🏠 CORRAL " + number
    );

    label.position.set(x, 12, 45);
    label.scale.set(25, 7, 1);

    map.add(label);
}

basePositions.forEach((x, i) => {
    createCorral(x, i + 1);
});

/* =========================================================
   PLAZA OWNER
   ========================================================= */

const plaza = new THREE.Mesh(
    new THREE.CylinderGeometry(18, 18, 2, 32),
    new THREE.MeshStandardMaterial({
        color: 0x302060,
        emissive: 0x24124c,
        emissiveIntensity: 0.4
    })
);

plaza.position.set(0, 1.5, 80);
map.add(plaza);

const plazaLabel =
    createTextSprite("👑 PLAZA OWNER 👑");

plazaLabel.position.set(0, 12, 80);
plazaLabel.scale.set(35, 10, 1);

map.add(plazaLabel);

/* =========================================================
   ÁRBOLES
   ========================================================= */

function createTree(x, z) {

    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(2, 2.5, 10, 8),
        new THREE.MeshStandardMaterial({
            color: 0x654321
        })
    );

    trunk.position.set(x, 5, z);
    map.add(trunk);

    const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(7, 8, 8),
        new THREE.MeshStandardMaterial({
            color: 0x217a38
        })
    );

    leaves.position.set(x, 12, z);
    map.add(leaves);
}

for (let x = -95; x <= 95; x += 25) {
    createTree(x, -135);
    createTree(x + 10, -165);
}

/* =========================================================
   CACTUS
   ========================================================= */

function createCactus(x, z) {

    const cactus = new THREE.Mesh(
        new THREE.CylinderGeometry(2, 2, 12, 8),
        new THREE.MeshStandardMaterial({
            color: 0x27843d
        })
    );

    cactus.position.set(x, 6, z);
    map.add(cactus);

    const arm = new THREE.Mesh(
        new THREE.BoxGeometry(7, 2, 2),
        new THREE.MeshStandardMaterial({
            color: 0x27843d
        })
    );

    arm.position.set(x + 3, 7, z);
    map.add(arm);
}

for (let x = -85; x <= 85; x += 35) {
    createCactus(x, -270);
}

/* =========================================================
   HIELO
   ========================================================= */

function createIce(x, z) {

    const crystal = new THREE.Mesh(
        new THREE.ConeGeometry(3, 14, 6),
        new THREE.MeshStandardMaterial({
            color: 0xc9f3ff,
            transparent: true,
            opacity: .9
        })
    );

    crystal.position.set(x, 7, z);
    map.add(crystal);
}

for (let x = -90; x <= 90; x += 30) {
    createIce(x, -405);
}

/* =========================================================
   VOLCANES
   ========================================================= */

function createVolcano(x, z) {

    const volcano = new THREE.Mesh(
        new THREE.ConeGeometry(18, 28, 8),
        new THREE.MeshStandardMaterial({
            color: 0x421919
        })
    );

    volcano.position.set(x, 14, z);
    map.add(volcano);

    const lava = new THREE.Mesh(
        new THREE.CylinderGeometry(5, 5, 2, 12),
        new THREE.MeshStandardMaterial({
            color: 0xff3300,
            emissive: 0xff2200,
            emissiveIntensity: 1
        })
    );

    lava.position.set(x, 28, z);
    map.add(lava);
}

createVolcano(-65, -540);
createVolcano(65, -540);

/* =========================================================
   ESTRELLAS
   ========================================================= */

for (let i = 0; i < 70; i++) {

    const star = new THREE.Mesh(
        new THREE.SphereGeometry(.8, 6, 6),
        new THREE.MeshStandardMaterial({
            color: 0xffffff,
            emissive: 0xffffff,
            emissiveIntensity: 1
        })
    );

    star.position.set(
        (Math.random() - .5) * 210,
        Math.random() * 35 + 4,
        -810 + (Math.random() - .5) * 80
    );

    map.add(star);
}

/* =========================================================
   DOMINIO DIVINO
   ========================================================= */

for (let i = 0; i < 8; i++) {

    const pillar = new THREE.Mesh(
        new THREE.CylinderGeometry(3, 3, 35, 12),
        new THREE.MeshStandardMaterial({
            color: 0xffdf6b,
            emissive: 0xffc400,
            emissiveIntensity: .35
        })
    );

    pillar.position.set(
        -85 + i * 25,
        17,
        -1080
    );

    map.add(pillar);
}

/* =========================================================
   TEXTO
   ========================================================= */

function createTextSprite(text) {

    const canvas = document.createElement("canvas");

    canvas.width = 1024;
    canvas.height = 256;

    const ctx = canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.font = "bold 70px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "white";
    ctx.strokeStyle = "black";
    ctx.lineWidth = 12;

    ctx.strokeText(
        text,
        canvas.width / 2,
        canvas.height / 2
    );

    ctx.fillText(
        text,
        canvas.width / 2,
        canvas.height / 2
    );

    const texture =
        new THREE.CanvasTexture(canvas);

    const material =
        new THREE.SpriteMaterial({
            map: texture,
            transparent: true
        });

    return new THREE.Sprite(material);
}

/* =========================================================
   JUGADOR
   ========================================================= */

const player = new THREE.Group();

const body = new THREE.Mesh(
    new THREE.BoxGeometry(4, 6, 3),
    new THREE.MeshStandardMaterial({
        color: 0x3366ff
    })
);

body.position.y = 5;
player.add(body);

const head = new THREE.Mesh(
    new THREE.BoxGeometry(4, 4, 4),
    new THREE.MeshStandardMaterial({
        color: 0xffcc99
    })
);

head.position.y = 10;
player.add(head);

player.position.set(0, 0, 20);

scene.add(player);

/* =========================================================
   MOVIMIENTO + SALTO
   ========================================================= */

const keys = {};

document.addEventListener("keydown", e => {

    keys[e.code] = true;

    if (
        e.code === "Space" &&
        player.position.y <= 0.05
    ) {
        playerVelocityY = 0.55;
    }
});

document.addEventListener("keyup", e => {
    keys[e.code] = false;
});

let speed = 0.8;
let playerVelocityY = 0;

const gravity = -0.025;

function updatePlayer() {

    if (keys["ShiftLeft"] || keys["ShiftRight"]) {
        speed = 1.5;
    } else {
        speed = 0.8;
    }

    if (keys["KeyW"]) {
        player.position.z -= speed;
    }

    if (keys["KeyS"]) {
        player.position.z += speed;
    }

    if (keys["KeyA"]) {
        player.position.x -= speed;
    }

    if (keys["KeyD"]) {
        player.position.x += speed;
    }

    /* Salto */

    playerVelocityY += gravity;
    player.position.y += playerVelocityY;

    if (player.position.y < 0) {
        player.position.y = 0;
        playerVelocityY = 0;
    }

    /* Límites del mapa */

    player.position.x =
        Math.max(
            -MAP_WIDTH / 2 + 5,
            Math.min(
                MAP_WIDTH / 2 - 5,
                player.position.x
            )
        );

    player.position.z =
        Math.max(
            -1080,
            Math.min(
                80,
                player.position.z
            )
        );
}

/* =========================================================
   CÁMARA + MOUSE
   ========================================================= */

let cameraYaw = 0;
let cameraPitch = 0.35;

document.addEventListener("mousemove", event => {

    if (
        document.pointerLockElement !==
        renderer.domElement
    ) {
        return;
    }

    cameraYaw -= event.movementX * 0.0025;
    cameraPitch -= event.movementY * 0.002;

    cameraPitch = Math.max(
        -0.2,
        Math.min(0.9, cameraPitch)
    );
});

function updateCamera() {

    const distance = 38;

    const horizontalDistance =
        Math.cos(cameraPitch) * distance;

    const cameraX =
        player.position.x -
        Math.sin(cameraYaw) *
        horizontalDistance;

    const cameraY =
        player.position.y +
        12 +
        Math.sin(cameraPitch) *
        distance;

    const cameraZ =
        player.position.z +
        Math.cos(cameraYaw) *
        horizontalDistance;

    const cameraPosition =
        new THREE.Vector3(
            cameraX,
            cameraY,
            cameraZ
        );

    camera.position.lerp(
        cameraPosition,
        0.12
    );

    const target =
        new THREE.Vector3(
            player.position.x,
            player.position.y + 6,
            player.position.z
        );

    camera.lookAt(target);
}

/* =========================================================
   ZONA ACTUAL
   ========================================================= */

function updateZone() {

    let closest = zones[0];
    let bestDistance = Infinity;

    zones.forEach(zone => {

        const distance =
            Math.abs(
                player.position.z - zone.z
            );

        if (distance < bestDistance) {
            bestDistance = distance;
            closest = zone;
        }
    });

    document.getElementById("zone")
        .textContent = closest.name;
}

/* =========================================================
   DINERO
   SIN MASCOTAS = $0
   ========================================================= */

let money = 0;

/*
   Más adelante:
   money += dineroGeneradoPorMascotas;
*/

document.getElementById("money")
    .textContent = "0";

/* =========================================================
   JUGAR
   ========================================================= */

document.getElementById("playButton")
    .addEventListener("click", () => {

        document.getElementById("startScreen")
            .style.display = "none";

        renderer.domElement
            .requestPointerLock?.();
    });

/* =========================================================
   ANIMACIÓN
   ========================================================= */

function animate() {

    requestAnimationFrame(animate);

    updatePlayer();
    updateCamera();
    updateZone();

    renderer.render(
        scene,
        camera
    );
}

animate();

/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});
</script>

</body>
</html>
