<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OWNER WORLD 2.0</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #87ceeb;
        font-family: Arial, sans-serif;
    }

    canvas {
        display: block;
    }

    #title {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 28px;
        font-weight: bold;
        text-shadow: 0 3px 8px #000;
        z-index: 10;
        pointer-events: none;
    }

    #controls {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 18px;
        border-radius: 12px;
        background: rgba(0,0,0,.55);
        color: white;
        z-index: 10;
        pointer-events: none;
        font-size: 14px;
    }
</style>
</head>

<body>

<div id="title">🌎 OWNER WORLD 2.0</div>
<div id="controls">WASD = mover · SHIFT = correr · ESPACIO = saltar</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

// ============================================================
// OWNER WORLD 2.0
// MAPA BASE — DESDE CERO
// ============================================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(0x87ceeb, 250, 1800);


// ============================================================
// CÁMARA
// ============================================================

const camera = new THREE.PerspectiveCamera(
    65,
    window.innerWidth / window.innerHeight,
    0.1,
    3000
);

camera.position.set(0, 18, 35);


// ============================================================
// RENDER
// ============================================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);


// ============================================================
// LUCES
// ============================================================

const ambientLight = new THREE.HemisphereLight(
    0xffffff,
    0x6b8e23,
    2
);

scene.add(ambientLight);

const sun = new THREE.DirectionalLight(
    0xffffff,
    2.2
);

sun.position.set(
    150,
    300,
    100
);

sun.castShadow = true;

scene.add(sun);


// ============================================================
// CONFIGURACIÓN DEL MAPA
// ============================================================

const MAP_WIDTH = 180;

const ZONE_LENGTH = 170;

const START_Z = 0;

const TOTAL_ZONES = 9;


// ============================================================
// MATERIALES
// ============================================================

const grassMaterial = new THREE.MeshStandardMaterial({
    color: 0x4f9d45
});

const dirtMaterial = new THREE.MeshStandardMaterial({
    color: 0x8b5a2b
});

const pathMaterial = new THREE.MeshStandardMaterial({
    color: 0xc69c6d
});

const woodMaterial = new THREE.MeshStandardMaterial({
    color: 0x7b421f
});

const woodLightMaterial = new THREE.MeshStandardMaterial({
    color: 0xa86732
});

const wallGrassMaterial = new THREE.MeshStandardMaterial({
    color: 0x5fae45
});


// ============================================================
// SUELO PRINCIPAL
// ============================================================

const totalLength = TOTAL_ZONES * ZONE_LENGTH + 350;

const groundGeometry = new THREE.BoxGeometry(
    MAP_WIDTH,
    4,
    totalLength
);

const ground = new THREE.Mesh(
    groundGeometry,
    grassMaterial
);

ground.position.set(
    0,
    -2,
    totalLength / 2 - 120
);

ground.receiveShadow = true;

scene.add(ground);


// ============================================================
// CAMINO PRINCIPAL
// ============================================================

const pathWidth = 48;

const pathGeometry = new THREE.BoxGeometry(
    pathWidth,
    0.35,
    totalLength
);

const path = new THREE.Mesh(
    pathGeometry,
    pathMaterial
);

path.position.set(
    0,
    0.15,
    totalLength / 2 - 120
);

path.receiveShadow = true;

scene.add(path);


// ============================================================
// PAREDES LATERALES
// ============================================================

function createNaturalWall(x, z, length) {

    const dirt = new THREE.Mesh(
        new THREE.BoxGeometry(
            12,
            18,
            length
        ),
        dirtMaterial
    );

    dirt.position.set(
        x,
        7,
        z
    );

    dirt.castShadow = true;
    dirt.receiveShadow = true;

    scene.add(dirt);


    const grassTop = new THREE.Mesh(
        new THREE.BoxGeometry(
            14,
            2,
            length
        ),
        wallGrassMaterial
    );

    grassTop.position.set(
        x,
        16.5,
        z
    );

    grassTop.castShadow = true;

    scene.add(grassTop);
}


// Pared izquierda

createNaturalWall(
    -96,
    totalLength / 2 - 120,
    totalLength
);


// Pared derecha

createNaturalWall(
    96,
    totalLength / 2 - 120,
    totalLength
);


// ============================================================
// CORRALES
// ============================================================

function createFence(x, z, width, depth) {

    const postHeight = 6;
    const postSize = 0.9;

    // POSTES

    const posts = [
        [-width / 2, -depth / 2],
        [width / 2, -depth / 2],
        [-width / 2, depth / 2],
        [width / 2, depth / 2]
    ];

    posts.forEach(p => {

        const post = new THREE.Mesh(
            new THREE.BoxGeometry(
                postSize,
                postHeight,
                postSize
            ),
            woodMaterial
        );

        post.position.set(
            x + p[0],
            postHeight / 2,
            z + p[1]
        );

        post.castShadow = true;

        scene.add(post);
    });


    // TABLAS FRONTALES Y TRASERAS

    for (const side of [-1, 1]) {

        const fence = new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                1.5,
                0.6
            ),
            woodLightMaterial
        );

        fence.position.set(
            x,
            3,
            z + side * depth / 2
        );

        fence.castShadow = true;

        scene.add(fence);
    }


    // TABLAS LATERALES

    for (const side of [-1, 1]) {

        const fence = new THREE.Mesh(
            new THREE.BoxGeometry(
                0.6,
                1.5,
                depth
            ),
            woodLightMaterial
        );

        fence.position.set(
            x + side * width / 2,
            3,
            z
        );

        fence.castShadow = true;

        scene.add(fence);
    }


    // SEGUNDO NIVEL DE VALLA

    for (const side of [-1, 1]) {

        const fence = new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                0.8,
                0.5
            ),
            woodMaterial
        );

        fence.position.set(
            x,
            4.7,
            z + side * depth / 2
        );

        scene.add(fence);
    }


    for (const side of [-1, 1]) {

        const fence = new THREE.Mesh(
            new THREE.BoxGeometry(
                0.5,
                0.8,
                depth
            ),
            woodMaterial
        );

        fence.position.set(
            x + side * width / 2,
            4.7,
            z
        );

        scene.add(fence);
    }
}


// ============================================================
// 4 CORRALES
// ============================================================

const corralPositions = [-65, -22, 22, 65];

corralPositions.forEach((x) => {

    createFence(
        x,
        35,
        34,
        42
    );

});


// ============================================================
// ZONA SEGURA
// ============================================================

const safeZoneGeometry = new THREE.BoxGeometry(
    150,
    0.4,
    50
);

const safeZoneMaterial = new THREE.MeshStandardMaterial({
    color: 0x79c85a
});

const safeZone = new THREE.Mesh(
    safeZoneGeometry,
    safeZoneMaterial
);

safeZone.position.set(
    0,
    0.2,
    82
);

scene.add(safeZone);


// ============================================================
// ZONAS
// ============================================================

const zones = [

    {
        name: "🌿 PRADERA INICIAL",
        color: 0x4f9d45
    },

    {
        name: "🌲 BOSQUE ENCANTADO",
        color: 0x28733a
    },

    {
        name: "🏜️ DESIERTO DORADO",
        color: 0xc99a45
    },

    {
        name: "❄️ CUMBRES HELADAS",
        color: 0xccecff
    },

    {
        name: "🌋 VOLCÁN CARMESÍ",
        color: 0x8f3825
    },

    {
        name: "🌊 ABISMO MARINO",
        color: 0x247fa3
    },

    {
        name: "🌌 GALAXIA PERDIDA",
        color: 0x49326e
    },

    {
        name: "♾️ SANTUARIO ETERNO",
        color: 0x7657a8
    },

    {
        name: "✨ DOMINIO DIVINO",
        color: 0xd8b94a
    }

];


// ============================================================
// PLATAFORMAS DE ZONAS
// ============================================================

zones.forEach((zone, index) => {

    const z =
        150 +
        index * ZONE_LENGTH;

    const geometry = new THREE.BoxGeometry(
        MAP_WIDTH - 30,
        0.5,
        ZONE_LENGTH
    );

    const material = new THREE.MeshStandardMaterial({
        color: zone.color
    });

    const mesh = new THREE.Mesh(
        geometry,
        material
    );

    mesh.position.set(
        0,
        0.1,
        z
    );

    mesh.receiveShadow = true;

    scene.add(mesh);

});


// ============================================================
// ÁRBOLES BÁSICOS
// ============================================================

function createTree(x, z, scale = 1) {

    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(
            1.1 * scale,
            1.4 * scale,
            7 * scale,
            8
        ),
        woodMaterial
    );

    trunk.position.set(
        x,
        3.5 * scale,
        z
    );

    trunk.castShadow = true;

    scene.add(trunk);


    const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(
            4.5 * scale,
            10,
            8
        ),
        new THREE.MeshStandardMaterial({
            color: 0x34843b
        })
    );

    leaves.position.set(
        x,
        8 * scale,
        z
    );

    leaves.castShadow = true;

    scene.add(leaves);
}


// Decoración sencilla alrededor del mapa

for (let z = 130; z < totalLength - 100; z += 35) {

    createTree(-72, z, 0.8);
    createTree(72, z + 15, 0.9);

}


// ============================================================
// JUGADOR TEMPORAL
// ============================================================

const player = new THREE.Group();


// CUERPO

const body = new THREE.Mesh(
    new THREE.BoxGeometry(
        2.5,
        3.5,
        1.5
    ),
    new THREE.MeshStandardMaterial({
        color: 0x2477ff
    })
);

body.position.y = 2.2;

body.castShadow = true;

player.add(body);


// CABEZA

const head = new THREE.Mesh(
    new THREE.BoxGeometry(
        2.2,
        2.2,
        2.2
    ),
    new THREE.MeshStandardMaterial({
        color: 0xffc79c
    })
);

head.position.y = 5;

head.castShadow = true;

player.add(head);


player.position.set(
    0,
    0,
    100
);

scene.add(player);


// ============================================================
// MOVIMIENTO
// ============================================================

const keys = {};

window.addEventListener("keydown", (e) => {
    keys[e.key.toLowerCase()] = true;

    if (e.code === "Space") {
        keys["space"] = true;
    }
});

window.addEventListener("keyup", (e) => {
    keys[e.key.toLowerCase()] = false;

    if (e.code === "Space") {
        keys["space"] = false;
    }
});


let velocityY = 0;

let onGround = true;


function updatePlayer() {

    const speed =
        keys["shift"] ? 0.45 : 0.25;


    if (keys["w"]) {
        player.position.z += speed;
    }

    if (keys["s"]) {
        player.position.z -= speed;
    }

    if (keys["a"]) {
        player.position.x -= speed;
    }

    if (keys["d"]) {
        player.position.x += speed;
    }


    // SALTO

    if (keys["space"] && onGround) {

        velocityY = 0.55;

        onGround = false;

    }


    velocityY -= 0.025;

    player.position.y += velocityY;


    if (player.position.y <= 0) {

        player.position.y = 0;

        velocityY = 0;

        onGround = true;

    }


    // LÍMITES LATERALES

    player.position.x = THREE.MathUtils.clamp(
        player.position.x,
        -82,
        82
    );

}


// ============================================================
// CÁMARA
// ============================================================

function updateCamera() {

    const targetX = player.position.x;

    const targetY = player.position.y + 7;

    const targetZ = player.position.z - 18;


    camera.position.lerp(
        new THREE.Vector3(
            targetX,
            targetY,
            targetZ
        ),
        0.08
    );


    camera.lookAt(
        player.position.x,
        player.position.y + 3,
        player.position.z
    );

}


// ============================================================
// RESIZE
// ============================================================

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});


// ============================================================
// ANIMACIÓN
// ============================================================

const clock = new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    updatePlayer();

    updateCamera();

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>
</html>
