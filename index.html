========================================================= */

========================================================= */

function mat(color, roughness = 1) {

}

/* =========================================================
   MUROS NATURALES
   MUCHO MÁS CERCA DE LAS ZONAS
========================================================= */

function createWall(x, zoneIndex) {

    const zoneStart =
        100 +
        zoneIndex * ZONE_LENGTH;

    const zoneCenter =
        zoneStart +
        ZONE_LENGTH / 2;

    const group = new THREE.Group();


    const wallMat = mat(
        zoneIndex === 2
            ? 0xb77c32
            : zoneIndex === 3
            ? 0xbcddea
            : zoneIndex === 4
            ? 0x5a2821
            : zoneIndex === 5
            ? 0x1b647c
            : zoneIndex === 6
            ? 0x34245c
            : zoneIndex >= 7
            ? 0x5d4a76
            : 0x765338
    );


    const grassMat = mat(
        zoneIndex === 2
            ? 0xcda14c
            : zoneIndex === 3
            ? 0xeafaff
            : zoneIndex === 4
            ? 0x7b3025
            : zoneIndex === 5
            ? 0x247f9e
            : zoneIndex === 6
            ? 0x513d82
            : zoneIndex >= 7
            ? 0x816aa5
            : 0x4f923e
    );


    /* muro principal */

    const wall = new THREE.Mesh(

        new THREE.BoxGeometry(
            8,
            10,
            ZONE_LENGTH + 6
        ),

        wallMat
    );

    wall.position.set(
        x,
        5,
        zoneCenter
    );

    wall.castShadow = true;

    group.add(wall);


    /* capa superior */

    const top = new THREE.Mesh(

        new THREE.BoxGeometry(
            9,
            1.8,
            ZONE_LENGTH + 6
        ),

        grassMat
    );

    top.position.set(
        x,
        10.8,
        zoneCenter
    );

    top.castShadow = true;

    group.add(top);


    scene.add(group);

}


for (
    let i = 0;
    i < TOTAL_ZONES;
    i++
) {

    createWall(-89, i);
    createWall(89, i);

}


/* =========================================================
   OBJETOS DECORATIVOS
========================================================= */

function cube(
    x,
    y,
    z,
    sx,
    sy,
    sz,
    color
) {

    const m = new THREE.Mesh(

        new THREE.BoxGeometry(
            sx,
            sy,
            sz
        ),

        mat(color)
    );

    m.position.set(
        x,
        y,
        z
    );

    m.castShadow = true;
    m.receiveShadow = true;

    scene.add(m);

    return m;
}


function cylinder(
    x,
    y,
    z,
    radius,
    height,
    color
) {

    const m = new THREE.Mesh(

        new THREE.CylinderGeometry(
            radius,
            radius,
            height,
            12
        ),

        mat(color)
    );

    m.position.set(
        x,
        y,
        z
    );

    m.castShadow = true;

    scene.add(m);

    return m;
}


function sphere(
    x,
    y,
    z,
    radius,
    color
) {

    const m = new THREE.Mesh(

        new THREE.SphereGeometry(
            radius,
            16,
            12
        ),

        mat(color)
    );

    m.position.set(
        x,
        y,
        z
    );

    m.castShadow = true;

    scene.add(m);

    return m;
}


/* =========================================================
   CORRALES
========================================================= */

function createFence(
    x,
    z,
    width,
    depth
) {

    const wood = mat(0x70431f);

    const woodDark = mat(0x4d2b16);


    function post(px, pz) {

        const p = new THREE.Mesh(

            new THREE.BoxGeometry(
                1.5,
                5,
                1.5
            ),

            woodDark
        );

        p.position.set(
            px,
            2.5,
            pz
        );

        p.castShadow = true;

        scene.add(p);

    }


    function rail(
        px,
        py,
        pz,
        sx,
        sy,
        sz
    ) {

        const r = new THREE.Mesh(

            new THREE.BoxGeometry(
                sx,
                sy,
                sz
            ),

            wood
        );

        r.position.set(
            px,
            py,
            pz
        );

        r.castShadow = true;

        scene.add(r);

    }


    const halfW = width / 2;
    const halfD = depth / 2;


    /* postes */

    const postPositions = [

        [-halfW, -halfD],
        [-halfW, 0],
        [-halfW, halfD],

        [halfW, -halfD],
        [halfW, 0],
        [halfW, halfD],

        [0, -halfD],
        [0, halfD]

    ];


    postPositions.forEach(p => {

        post(
            x + p[0],
            z + p[1]
        );

    });


    /* laterales */

    rail(
        x - halfW,
        2,
        z,
        1,
        1,
        depth
    );

    rail(
        x + halfW,
        2,
        z,
        1,
        1,
        depth
    );


    /* frente */

    rail(
        x,
        2,
        z - halfD,
        width,
        1,
        1
    );


    /* fondo */

    rail(
        x,
        2,
        z + halfD,
        width,
        1,
        1
    );


    /* segunda fila */

    rail(
        x - halfW,
        3.7,
        z,
        1,
        0.8,
        depth
    );

    rail(
        x + halfW,
        3.7,
        z,
        1,
        0.8,
        depth
    );

    rail(
        x,
        3.7,
        z - halfD,
        width,
        0.8,
        1
    );

    rail(
        x,
        3.7,
        z + halfD,
        width,
        0.8,
        1
    );

}


/* cuatro corrales */

const corralX = [

}

/* =========================================================
   DOMINIO DIVINO
========================================================= */

function divineDomain() {

    const start =
        100 +
        8 * ZONE_LENGTH;


    /* -----------------------------------------------------
       CASTILLO DIVINO CENTRAL
    ----------------------------------------------------- */

    const castle = new THREE.Group();


    /* edificio principal */

    const main =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                26,
                20,
                24
            ),

            mat(0xf0dfad)
        );

    main.position.y = 10;

    main.castShadow = true;

    castle.add(main);


    /* torres */

    const towerPositions = [

        [-15, -13],
        [15, -13],
        [-15, 13],
        [15, 13]

    ];


    towerPositions.forEach(pos => {

        const tower =
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    4,
                    4,
                    28,
                    8
                ),

                mat(0xe8d19a)
            );

        tower.position.set(
            pos[0],
            14,
            pos[1]
        );

        tower.castShadow = true;

        castle.add(tower);


        /* punta */

        const roof =
            new THREE.Mesh(

                new THREE.ConeGeometry(
                    5.5,
                    9,
                    4
                ),

                mat(0xd4a83c)
            );

        roof.position.set(
            pos[0],
            32,
            pos[1]
        );

        roof.castShadow = true;

        castle.add(roof);

    });


    /* techo central */

    const roof =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                19,
                12,
                4
            ),

            mat(0xd8ae43)
        );

    roof.position.y = 26;

    roof.rotation.y =
        Math.PI / 4;

    roof.castShadow = true;

    castle.add(roof);


    castle.position.set(
        0,
        0,
        start + 80
    );


    scene.add(castle);


    /* -----------------------------------------------------
       COLUMNAS DIVINAS
    ----------------------------------------------------- */

    const columnX = [
        -55,
        55
    ];


    columnX.forEach(x => {

        for (
            let i = 0;
            i < 4;
            i++
        ) {

            const z =
                start +
                20 +
                i * 38;

            cylinder(
                x,
                9,
                z,
                3,
                18,
                0xf1dfad
            );


            /* esfera superior */

            sphere(
                x,
                19,
                z,
                3,
                0xffe9a3
            );

        }

    });


    /* -----------------------------------------------------
       SÍMBOLOS DIVINOS
    ----------------------------------------------------- */

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        const side =
            i % 2 === 0
                ? -68
                : 68;

        const z =
            start +
            25 +
            i * 27;


        /* círculo */

        const ring =
            new THREE.Mesh(

                new THREE.TorusGeometry(
                    5,
                    0.8,
                    10,
                    32
                ),

                mat(0xffdc55)
            );

        ring.position.set(
            side,
            8,
            z
        );

        ring.rotation.y =
            Math.PI / 2;

        scene.add(ring);


        /* símbolo vertical */

        cube(
            side,
            8,
            z,
            1,
            8,
            1,
            0xffe47a
        );

    }


    /* -----------------------------------------------------
       ESTATUAS / MONUMENTOS
    ----------------------------------------------------- */

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const x =
            i % 2 === 0
                ? -38
                : 38;

        const z =
            start +
            45 +
            Math.floor(i / 2) * 65;


        cylinder(
            x,
            3,
            z,
            4,
            6,
            0xcdb889
        );


        const monument =
            new THREE.Mesh(

                new THREE.ConeGeometry(
                    3,
                    10,
                    5
                ),

                mat(0xffdf72)
            );

        monument.position.set(
            x,
            11,
            z
        );

        monument.castShadow = true;

        scene.add(monument);

    }

}

head.position.y = 5.1;

head.castShadow = true;

player.add(head);


player.position.set(
    0,
    0,
    100
);

scene.add(player);


/* =========================================================
   MOVIMIENTO
========================================================= */

const keys = {};

document.addEventListener(
    "keydown",
    e => {
        keys[e.key.toLowerCase()] = true;
    }
);

document.addEventListener(
    "keyup",
    e => {
        keys[e.key.toLowerCase()] = false;
    }
);


let velocityY = 0;

let grounded = true;


function updatePlayer() {

    const speed =
        keys["shift"]
            ? 0.65
            : 0.38;


    if (keys["w"]) {
        player.position.z += speed;
    }

    if (keys["s"]) {
        player.position.z -= speed;
    }

    if (keys["a"]) {
        player.position.x -= speed;
    }

    if (keys["d"]) {
        player.position.x += speed;
    }


    /* limitar jugador al mapa */

    player.position.x =
        Math.max(
            -78,
            Math.min(
                78,
                player.position.x
            )
        );


    /* salto */

    if (
        keys[" "] &&
        grounded
    ) {

        velocityY = 0.45;

        grounded = false;

    }


    velocityY -= 0.025;

    player.position.y += velocityY;


    if (
        player.position.y <= 0
    ) {

        player.position.y = 0;

        velocityY = 0;

        grounded = true;

    }

}


/* =========================================================
   CAMARA
========================================================= */

function updateCamera() {

    const targetX =
        player.position.x;

    const targetY =
        player.position.y + 7;

    const targetZ =
        player.position.z - 13;


    camera.position.lerp(

        new THREE.Vector3(
            targetX,
            targetY,
            targetZ
        ),

        0.08
    );


    camera.lookAt(

        player.position.x,
        player.position.y + 3,
        player.position.z + 5

    );

}


/* =========================================================
   ACTUALIZAR NOMBRE DE ZONA
========================================================= */

function updateZoneName() {

    let index =
        Math.floor(
            (player.position.z - 100) /
            ZONE_LENGTH
        );

    if (index < 0) {
        index = 0;
    }

    if (index >= TOTAL_ZONES) {
        index = TOTAL_ZONES - 1;
    }


    document.getElementById(
        "zoneName"
    ).textContent =
        zones[index].name +
        "  •  Nivel " +
        zones[index].level;

}


/* =========================================================
   ANIMACIÓN
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    updatePlayer();

    updateCamera();

    updateZoneName();


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
