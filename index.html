<body>

<div id="startScreen">
    <h1>👑 OWNER WORLD 👑</h1>
    <p>Explora las zonas. Consigue mascotas. Conviértete en el dueño.</p>

    <button id="playButton">JUGAR</button>

    <div id="version">V0.5</div>
</div>

<div id="hud">
    <div id="title">👑 OWNER WORLD</div>
    <div id="money">💰 $0</div>
    <div id="zone">🌿 Pradera Inicial</div>
</div>

<div id="announcement"></div>

<div id="help">
    WASD = Mover &nbsp; | &nbsp; Mouse = Cámara &nbsp; | &nbsp; SPACE = Saltar
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>
/* =========================================================
   OWNER WORLD V0.5
   MAP + ZONAS + CORRALES + DECORACIÓN
   ========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x83cfff);
scene.fog = new THREE.Fog(0x83cfff, 250, 1450);

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    2500
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

/* =========================================================
   LUCES
   ========================================================= */

const hemiLight = new THREE.HemisphereLight(
    0xffffff,
    0x42643c,
    1.8
);

scene.add(hemiLight);

const sun = new THREE.DirectionalLight(
    0xffffff,
    2.2
);

sun.position.set(-250, 400, 150);
sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -500;
sun.shadow.camera.right = 500;
sun.shadow.camera.top = 500;
sun.shadow.camera.bottom = -1200;

scene.add(sun);

/* =========================================================
   MATERIALES
   ========================================================= */

const mat = {
    grass: new THREE.MeshStandardMaterial({ color: 0x58a946 }),
    grass2: new THREE.MeshStandardMaterial({ color: 0x76bd4c }),
    dirt: new THREE.MeshStandardMaterial({ color: 0x7b4d2a }),
    dirtDark: new THREE.MeshStandardMaterial({ color: 0x56351e }),
    stone: new THREE.MeshStandardMaterial({ color: 0x747b82 }),
    wood: new THREE.MeshStandardMaterial({ color: 0x71452a }),
    leaves: new THREE.MeshStandardMaterial({ color: 0x25833c }),
    leaves2: new THREE.MeshStandardMaterial({ color: 0x42a843 }),
    sand: new THREE.MeshStandardMaterial({ color: 0xd7ad5c }),
    sandstone: new THREE.MeshStandardMaterial({ color: 0xc9964b }),
    snow: new THREE.MeshStandardMaterial({ color: 0xeaf8ff }),
    ice: new THREE.MeshStandardMaterial({
        color: 0x69d9ff,
        transparent: true,
        opacity: .75
    }),
    rock: new THREE.MeshStandardMaterial({ color: 0x30343b }),
    lava: new THREE.MeshStandardMaterial({
        color: 0xff4a16,
        emissive: 0xff2600,
        emissiveIntensity: 2
    }),
    water: new THREE.MeshStandardMaterial({
        color: 0x168ed0,
        transparent: true,
        opacity: .72
    }),
    galaxy: new THREE.MeshStandardMaterial({
        color: 0x30205d,
        emissive: 0x160c35,
        emissiveIntensity: .7
    }),
    purple: new THREE.MeshStandardMaterial({
        color: 0x774cff,
        emissive: 0x37118c,
        emissiveIntensity: 1.4
    }),
    gold: new THREE.MeshStandardMaterial({
        color: 0xffd447,
        emissive: 0xff9f00,
        emissiveIntensity: .7
    }),
    white: new THREE.MeshStandardMaterial({
        color: 0xf5f5ff
    }),
    dark: new THREE.MeshStandardMaterial({
        color: 0x151521
    })
};

/* =========================================================
   HELPERS
   ========================================================= */

function box(
    x, y, z,
    sx, sy, sz,
    material,
    parent = scene
) {
    const geo = new THREE.BoxGeometry(sx, sy, sz);
    const mesh = new THREE.Mesh(geo, material);

    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);
    return mesh;
}

function cyl(
    x, y, z,
    radius,
    height,
    material,
    segments = 10,
    parent = scene
) {
    const geo = new THREE.CylinderGeometry(
        radius,
        radius,
        height,
        segments
    );

    const mesh = new THREE.Mesh(geo, material);

    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);
    return mesh;
}

function sphere(
    x, y, z,
    radius,
    material,
    parent = scene
) {
    const geo = new THREE.SphereGeometry(radius, 12, 8);
    const mesh = new THREE.Mesh(geo, material);

    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);
    return mesh;
}

function cone(
    x, y, z,
    radius,
    height,
    material,
    parent = scene
) {
    const geo = new THREE.ConeGeometry(
        radius,
        height,
        8
    );

    const mesh = new THREE.Mesh(geo, material);

    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);
    return mesh;
}

/* =========================================================
   MAP
   ========================================================= */

const MAP_WIDTH = 230;
const HALF_WIDTH = MAP_WIDTH / 2;

const ZONE_LENGTH = 175;

const START_Z = 110;
const END_Z = START_Z - ZONE_LENGTH * 9;

const roadWidth = 30;

/* =========================================================
   TERRENO BASE
   ========================================================= */

box(
    0,
    -1,
    (START_Z + END_Z) / 2,
    MAP_WIDTH,
    2,
    START_Z - END_Z + 80,
    mat.grass
);

/* =========================================================
   ZONAS
   ========================================================= */

const zones = [
    {
        name: "🌿 Pradera Inicial",
        color: 0x58a946,
        material: mat.grass
    },
    {
        name: "🌲 Bosque Encantado",
        color: 0x3c7d3a,
        material: new THREE.MeshStandardMaterial({ color: 0x3c7d3a })
    },
    {
        name: "🏜️ Desierto Dorado",
        color: 0xd7ad5c,
        material: mat.sand
    },
    {
        name: "❄️ Cumbres Heladas",
        color: 0xb8e9f7,
        material: new THREE.MeshStandardMaterial({ color: 0xb8e9f7 })
    },
    {
        name: "🌋 Volcán Carmesí",
        color: 0x351f1b,
        material: new THREE.MeshStandardMaterial({ color: 0x351f1b })
    },
    {
        name: "🌊 Abismo Marino",
        color: 0x126a9c,
        material: new THREE.MeshStandardMaterial({ color: 0x126a9c })
    },
    {
        name: "🌌 Galaxia Perdida",
        color: 0x30205d,
        material: mat.galaxy
    },
    {
        name: "♾️ Santuario Eterno",
        color: 0x827fa5,
        material: new THREE.MeshStandardMaterial({ color: 0x827fa5 })
    },
    {
        name: "✨ Dominio Divino",
        color: 0xe5c94c,
        material: new THREE.MeshStandardMaterial({ color: 0xc7a52d })
    }
];

for (let i = 0; i < zones.length; i++) {

    const top = START_Z - i * ZONE_LENGTH;
    const bottom = top - ZONE_LENGTH;

    box(
        0,
        .05,
        (top + bottom) / 2,
        MAP_WIDTH - 10,
        .2,
        ZONE_LENGTH - 4,
        zones[i].material
    );
}

/* =========================================================
   CAMINO PRINCIPAL
   ========================================================= */

const roadMat = new THREE.MeshStandardMaterial({
    color: 0x9a7955
});

box(
    0,
    .13,
    (START_Z + END_Z) / 2,
    roadWidth,
    .25,
    START_Z - END_Z,
    roadMat
);

/* Bordes del camino */

for (let z = START_Z; z > END_Z; z -= 10) {

    box(
        -roadWidth / 2 - 1.3,
        .3,
        z,
        2,
        .45,
        8,
        mat.stone
    );

    box(
        roadWidth / 2 + 1.3,
        .3,
        z,
        2,
        .45,
        8,
        mat.stone
    );
}

/* =========================================================
   PAREDES NATURALES
   ========================================================= */

function makeNaturalWall(x, z, length, side) {

    const yBase = 5;

    box(
        x,
        yBase,
        z,
        9,
        10,
        length,
        mat.dirtDark
    );

    box(
        x,
        10.3,
        z,
        10,
        1.8,
        length + 1,
        mat.grass
    );

    for (let i = -length / 2; i <= length / 2; i += 22) {

        const rockX =
            x + (side === "left" ? 1.2 : -1.2);

        box(
            rockX,
            3.5,
            z + i,
            3,
            7,
            6,
            mat.dirt
        );
    }
}

/* Pared izquierda */

makeNaturalWall(
    -HALF_WIDTH + 2,
    (START_Z + END_Z) / 2,
    START_Z - END_Z + 40,
    "left"
);

/* Pared derecha */

makeNaturalWall(
    HALF_WIDTH - 2,
    (START_Z + END_Z) / 2,
    START_Z - END_Z + 40,
    "right"
);

/* Pared final */

box(
    0,
    5,
    END_Z - 8,
    MAP_WIDTH,
    10,
    8,
    mat.dirtDark
);

box(
    0,
    10.3,
    END_Z - 8,
    MAP_WIDTH + 2,
    2,
    10,
    mat.grass
);

/* =========================================================
   DECORACIÓN GENERAL
   ========================================================= */

function tree(x, z, scale = 1) {

    const group = new THREE.Group();

    cyl(
        x,
        3 * scale,
        z,
        1.5 * scale,
        6 * scale,
        mat.wood,
        8,
        group
    );

    sphere(
        x,
        7 * scale,
        z,
        4 * scale,
        mat.leaves,
        group
    );

    sphere(
        x + 2 * scale,
        8 * scale,
        z,
        3 * scale,
        mat.leaves2,
        group
    );

    scene.add(group);
}

function rock(x, z, scale = 1, material = mat.stone) {

    box(
        x,
        1.3 * scale,
        z,
        4 * scale,
        2.6 * scale,
        3 * scale,
        material
    );
}

function flower(x, z) {

    cyl(
        x,
        .6,
        z,
        .12,
        1.2,
        mat.leaves,
        6
    );

    sphere(
        x,
        1.3,
        z,
        .5,
        new THREE.MeshStandardMaterial({
            color: 0xffd83d
        })
    );
}

/* =========================================================
   PRADERA
   ========================================================= */

const meadowTop = START_Z;
const meadowBottom = START_Z - ZONE_LENGTH;

for (let i = 0; i < 18; i++) {

    const x =
        -90 + Math.random() * 180;

    const z =
        meadowBottom + 15 +
        Math.random() * (ZONE_LENGTH - 30);

    if (Math.abs(x) > 25) {
        tree(x, z, .8 + Math.random() * .35);
    }
}

for (let i = 0; i < 30; i++) {

    const x =
        -95 + Math.random() * 190;

    const z =
        meadowBottom + Math.random() * ZONE_LENGTH;

    if (Math.abs(x) > 22) {
        flower(x, z);
    }
}

/* Pequeño lago */

const pond = new THREE.Mesh(
    new THREE.CylinderGeometry(13, 13, .3, 32),
    mat.water
);

pond.position.set(72, .3, 25);
pond.scale.z = .65;

scene.add(pond);

/* =========================================================
   CORRALES
   ========================================================= */

const corralZ = 68;

function makeCorral(x, number) {

    const floor = new THREE.Mesh(
        new THREE.BoxGeometry(43, .5, 42),
        new THREE.MeshStandardMaterial({
            color: 0x8d6945
        })
    );

    floor.position.set(x, .25, corralZ);
    floor.receiveShadow = true;

    scene.add(floor);

    /* Postes decorativos, SIN paredes */

    const postPositions = [
        [-19, -18],
        [19, -18],
        [-19, 18],
        [19, 18]
    ];

    for (const [px, pz] of postPositions) {

        box(
            x + px,
            2,
            corralZ + pz,
            1.2,
            4,
            1.2,
            mat.wood
        );
    }

    /* Cartel */

    box(
        x,
        4,
        corralZ - 21,
        11,
        3,
        1,
        mat.wood
    );

    const label = document.createElement("div");

    label.textContent = "CORRAL " + number;

    label.style.position = "fixed";
    label.style.pointerEvents = "none";
}

/* 4 corrales en una sola línea */

makeCorral(-78, 1);
makeCorral(-26, 2);
makeCorral(26, 3);
makeCorral(78, 4);

/* =========================================================
   PLAZA INICIAL
   ========================================================= */

const plaza = new THREE.Mesh(
    new THREE.CylinderGeometry(28, 28, .8, 32),
    new THREE.MeshStandardMaterial({
        color: 0x6c765f
    })
);

plaza.position.set(0, .4, 18);
plaza.scale.z = .7;

scene.add(plaza);

/* Portal de inicio */

function makePortal(x, z) {

    const left = box(
        x - 12,
        8,
        z,
        4,
        16,
        4,
        mat.stone
    );

    const right = box(
        x + 12,
        8,
        z,
        4,
        16,
        4,
        mat.stone
    );

    box(
        x,
        16,
        z,
        28,
        4,
        4,
        mat.stone
    );

    box(
        x,
        8,
        z - 1,
        18,
        13,
        1,
        new THREE.MeshStandardMaterial({
            color: 0x684cff,
            emissive: 0x2c1188,
            emissiveIntensity: 1.5,
            transparent: true,
            opacity: .55
        })
    );
}

makePortal(0, -8);

/* =========================================================
   BOSQUE ENCANTADO
   ========================================================= */

const forestTop = START_Z - ZONE_LENGTH;
const forestBottom = forestTop - ZONE_LENGTH;

for (let i = 0; i < 35; i++) {

    const x =
        -95 + Math.random() * 190;

    const z =
        forestBottom + 10 +
        Math.random() * (ZONE_LENGTH - 20);

    if (Math.abs(x) > 23) {
        tree(x, z, .8 + Math.random() * .5);
    }
}

for (let i = 0; i < 12; i++) {

    const x = -90 + Math.random() * 180;
    const z = forestBottom + Math.random() * ZONE_LENGTH;

    rock(x, z, .7);
}

/* =========================================================
   DESIERTO DORADO
   ========================================================= */

const desertTop = START_Z - ZONE_LENGTH * 2;
const desertBottom = desertTop - ZONE_LENGTH;

for (let i = 0; i < 18; i++) {

    const x =
        -90 + Math.random() * 180;

    const z =
        desertBottom + Math.random() * ZONE_LENGTH;

    if (Math.abs(x) > 23) {

        cone(
            x,
            3,
            z,
            5 + Math.random() * 4,
            6 + Math.random() * 5,
            mat.sandstone
        );
    }
}

/* Cactus */

function cactus(x, z) {

    cyl(
        x,
        3,
        z,
        1.3,
        6,
        mat.leaves,
        8
    );

    cyl(
        x + 2,
        3.5,
        z,
        .7,
        3,
        mat.leaves,
        8
    );
}

for (let i = 0; i < 15; i++) {

    const x =
        -90 + Math.random() * 180;

    const z =
        desertBottom + Math.random() * ZONE_LENGTH;

    if (Math.abs(x) > 23) {
        cactus(x, z);
    }
}

/* =========================================================
   CUMBRES HELADAS
   ========================================================= */

const iceTop = START_Z - ZONE_LENGTH * 3;
const iceBottom = iceTop - ZONE_LENGTH;

for (let i = 0; i < 14; i++) {

    const x =
        -95 + Math.random() * 190;

    const z =
        iceBottom + Math.random() * ZONE_LENGTH;

    if (Math.abs(x) > 23) {

        cone(
            x,
            10,
            z,
            9 + Math.random() * 7,
            20 + Math.random() * 15,
            mat.snow
        );
    }
}

for (let i = 0; i < 18; i++) {

    const x =
        -90 + Math.random() * 180;

    const z =
        iceBottom + Math.random() * ZONE_LENGTH;

    if (Math.abs(x) > 23) {

        cone(
            x,
            3,
            z,
            2,
            8,
            mat.ice
        );
    }
}

/* =========================================================
   VOLCÁN CARMESÍ
   ========================================================= */

const volcanoTop = START_Z - ZONE_LENGTH * 4;
const volcanoBottom = volcanoTop - ZONE_LENGTH;

/* Montañas */

for (let i = 0; i < 9; i++) {

    const x =
        -90 + Math.random() * 180;

    const z =
        volcanoBottom + Math.random() * ZONE_LENGTH;

    if (Math.abs(x) > 25) {

        cone(
            x,
            9,
            z,
            10 + Math.random() * 7,
            18 + Math.random() * 15,
            mat.rock
        );
    }
}

/* Lava */

for (let i = 0; i < 7; i++) {

    const x =
        -75 + Math.random() * 150;

    const z =
        volcanoBottom + Math.random() * ZONE_LENGTH;

    if (Math.abs(x) > 24) {

        box(
            x,
            .35,
            z,
            4,
            .35,
            14,
            mat.lava
        );
    }
}

/* =========================================================
   ABISMO MARINO
   ========================================================= */

const oceanTop = START_Z - ZONE_LENGTH * 5;
const oceanBottom = oceanTop - ZONE_LENGTH;

/* Agua alrededor del camino */

box(
    -55,
    .2,
    (oceanTop + oceanBottom) / 2,
    70,
    .35,
    ZONE_LENGTH,
    mat.water
);

box(
    55,
    .2,
    (oceanTop + oceanBottom) / 2,
    70,
    .35,
    ZONE_LENGTH,
    mat.water
);

function coral(x, z) {

    cyl(
        x,
        2,
        z,
        1.3,
        4,
        new THREE.MeshStandardMaterial({
            color: 0xff4c9b
        }),
        7
    );

    cyl(
        x + 2,
        2.5,
        z,
        .7,
        5,
        new THREE.MeshStandardMaterial({
            color: 0xff7148
        }),
        7
    );
}

for (let i = 0; i < 25; i++) {

    const x =
        -95 + Math.random() * 190;

    const z =
        oceanBottom + Math.random() * ZONE_LENGTH;

    if (Math.abs(x) > 25) {
        coral(x, z);
    }
}

/* Arcos submarinos */

for (let i = 0; i < 4; i++) {

    const z =
        oceanBottom + 20 + i * 38;

    box(
        -55,
        8,
        z,
        5,
        16,
        5,
        mat.stone
    );

    box(
        55,
        8,
        z,
        5,
        16,
        5,
        mat.stone
    );

    box(
        0,
        16,
        z,
        115,
        5,
        5,
        mat.stone
    );
}

/* =========================================================
   GALAXIA PERDIDA
   ========================================================= */

const galaxyTop = START_Z - ZONE_LENGTH * 6;
const galaxyBottom = galaxyTop - ZONE_LENGTH;

/* Cristales */

function crystal(x, z, scale = 1) {

    const geo = new THREE.OctahedronGeometry(
        2.5 * scale,
        0
    );

    const mesh = new THREE.Mesh(
        geo,
        mat.purple
    );

    mesh.position.set(
        x,
        3.5 * scale,
        z
    );

    ) {

document.addEventListener("keyup", (e) => {
    keys[e.code] = false;
});

let playerVelocityY = 0;
const gravity = -0.028;

/* =========================================================
   CÁMARA CON MOUSE
   ========================================================= */

let cameraYaw = 0;
let cameraPitch = 0.35;

document.addEventListener("mousemove", (event) => {

    if (
        document.pointerLockElement !==
        renderer.domElement
    ) {
        return;
    }

    cameraYaw -= event.movementX * 0.0025;
    cameraPitch -= event.movementY * 0.002;

    cameraPitch = Math.max(
        -0.2,
        Math.min(0.9, cameraPitch)
    );
});

/* =========================================================
   DINERO
   ========================================================= */

   IMPORTANTE:
   No se genera dinero automáticamente.
   El jugador comienza en $0.
   Más adelante V0.6 conectaremos mascotas
   y generación de dinero.
*/

let money = 0;

/* =========================================================
   ZONA ACTUAL
   ========================================================= */

function updateZone() {

    const relative =
        START_Z - player.position.z;

    let index =
        Math.floor(relative / ZONE_LENGTH);

    index = Math.max(
        0,
        Math.min(zones.length - 1, index)
    );

    document.getElementById("zone").textContent =
        zones[index].name;
}

/* =========================================================
   MOVIMIENTO
   ========================================================= */

function updatePlayer() {

    const speed =
        keys["ShiftLeft"] ||
        keys["ShiftRight"]
            ? 0.32
            : 0.20;

    let dx = 0;
    let dz = 0;

    if (keys["KeyW"]) dz -= 1;
    if (keys["KeyS"]) dz += 1;
    if (keys["KeyA"]) dx -= 1;
    if (keys["KeyD"]) dx += 1;

    if (dx !== 0 || dz !== 0) {

        const length =
            Math.sqrt(dx * dx + dz * dz);

        dx /= length;
        dz /= length;

        player.position.x += dx * speed;
        player.position.z += dz * speed;
    }

    /* Gravedad */

    playerVelocityY += gravity;
    player.position.y += playerVelocityY;

    if (player.position.y < 0) {

        player.position.y = 0;
        playerVelocityY = 0;
    }

    /* Límites laterales */

    player.position.x = THREE.MathUtils.clamp(
        player.position.x,
        -HALF_WIDTH + 13,
        HALF_WIDTH - 13
    );

    /* Límites del mapa */

    player.position.z = THREE.MathUtils.clamp(
        player.position.z,
        END_Z + 12,
        START_Z + 35
    );

    updateZone();
}

/* =========================================================
   CÁMARA
   ========================================================= */

function updateCamera() {

    const distance = 38;

    const horizontalDistance =
        Math.cos(cameraPitch) * distance;

    const cameraX =
        player.position.x -
        Math.sin(cameraYaw) *
        horizontalDistance;

    const cameraY =
        player.position.y +
        12 +
        Math.sin(cameraPitch) * distance;

    const cameraZ =
        player.position.z +
        Math.cos(cameraPitch) *
        horizontalDistance;

    const cameraPosition =
        new THREE.Vector3(
            cameraX,
            cameraY,
            cameraZ
        );

    camera.position.lerp(
        cameraPosition,
        0.12
    );

    const target =
        new THREE.Vector3(
            player.position.x,
            player.position.y + 5,
            player.position.z
        );

    camera.lookAt(target);
}

        document.getElementById("announcement");

    element.textContent = text;
    element.style.opacity = "1";

    setTimeout(() => {
        element.style.opacity = "0";
    }, 3500);
}

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

/* =========================================================
   ANIMACIÓN
   ========================================================= */

const clock = new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const time = clock.getElapsedTime();

    updatePlayer();
    updateCamera();

    /* Animación suave de cristales */

    scene.traverse((object) => {

        if (
            object.isMesh &&
            object.material &&
            object.material === mat.purple
        ) {
            object.rotation.y += 0.006;
            object.position.y +=
                Math.sin(time * 2 + object.position.x) *
                0.002;
        }
    });

    renderer.render(
        scene,
        camera
    );
}

animate();
