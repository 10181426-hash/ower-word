<body>

<div id="startScreen">
    <h1>OWNER WORLD</h1>
    <p>El comienzo de un mundo enorme 👑</p>
    <button id="playButton">JUGAR</button>
</div>

<div id="hud">
    <h1>👑 OWNER WORLD</h1>
    <div>💰 Dinero: <span id="money">0</span></div>
    <div>📍 Zona: <span id="zone">Pradera Inicial</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
/* =========================================================
   OWNER WORLD V0.2
   MAPA + 9 ZONAS + 4 BASES ALINEADAS
   ========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 180, 950);

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

/* =========================================================
   LUCES
   ========================================================= */

const hemiLight = new THREE.HemisphereLight(
    0xffffff,
    0x445566,
    2
);

scene.add(hemiLight);

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(100, 200, 100);
scene.add(sun);

/* =========================================================
   GRUPO PRINCIPAL DEL MAPA
   ========================================================= */

const map = new THREE.Group();
scene.add(map);

/* =========================================================
   TERRENO
   ========================================================= */

const groundGeometry = new THREE.BoxGeometry(260, 2, 1250);

const groundMaterial = new THREE.MeshStandardMaterial({
    color: 0x4c8f45
});

const ground = new THREE.Mesh(
    groundGeometry,
    groundMaterial
);

ground.position.set(0, -1, -420);
map.add(ground);

/* =========================================================
   CAMINO CENTRAL
   ========================================================= */

const roadMaterial = new THREE.MeshStandardMaterial({
    color: 0x555555
});

const roadGeometry = new THREE.BoxGeometry(34, 0.4, 1050);

const road = new THREE.Mesh(
    roadGeometry,
    roadMaterial
);

road.position.set(0, 0.2, -420);
map.add(road);

/* =========================================================
   ZONAS
   De abajo hacia arriba:
   Pradera → ... → Dominio Divino
   ========================================================= */

const zones = [
    {
        name: "🌿 Pradera Inicial",
        z: 0,
        color: 0x63b84d
    },
    {
        name: "🌲 Bosque Encantado",
        z: -120,
        color: 0x286b3b
    },
    {
        name: "🏜️ Desierto Dorado",
        z: -240,
        color: 0xd7a842
    },
    {
        name: "❄️ Cumbres Heladas",
        z: -360,
        color: 0xbde8ff
    },
    {
        name: "🌋 Volcán Carmesí",
        z: -480,
        color: 0x8f2929
    },
    {
        name: "🌊 Abismo Marino",
        z: -600,
        color: 0x176b91
    },
    {
        name: "🌌 Galaxia Perdida",
        z: -720,
        color: 0x352060
    },
    {
        name: "♾️ Santuario Eterno",
        z: -840,
        color: 0x725ca8
    },
    {
        name: "✨ Dominio Divino",
        z: -960,
        color: 0xd9c875
    }
];

/* =========================================================
   CREAR MARCADORES DE ZONA
   ========================================================= */

function createZone(zone) {

    const platformGeometry = new THREE.BoxGeometry(
        220,
        0.5,
        92
    );

    const platformMaterial =
        new THREE.MeshStandardMaterial({
            color: zone.color
        });

    const platform = new THREE.Mesh(
        platformGeometry,
        platformMaterial
    );

    platform.position.set(0, 0.5, zone.z);
    map.add(platform);

    /* Entrada visual de la zona */

    const gateGeometry = new THREE.BoxGeometry(
        65,
        18,
        3
    );

    const gateMaterial =
        new THREE.MeshStandardMaterial({
            color: zone.color,
            emissive: zone.color,
            emissiveIntensity: 0.15
        });

    const gate = new THREE.Mesh(
        gateGeometry,
        gateMaterial
    );

    gate.position.set(0, 9, zone.z - 43);
    map.add(gate);

    /* Pilares */

    const pillarGeometry =
        new THREE.BoxGeometry(5, 18, 5);

    const leftPillar = new THREE.Mesh(
        pillarGeometry,
        gateMaterial
    );

    const rightPillar = new THREE.Mesh(
        pillarGeometry,
        gateMaterial
    );

    leftPillar.position.set(-35, 9, zone.z - 43);
    rightPillar.position.set(35, 9, zone.z - 43);

    map.add(leftPillar);
    map.add(rightPillar);

    /* Pequeños detalles laterales */

    for (let i = -4; i <= 4; i++) {

        const detail = new THREE.Mesh(
            new THREE.BoxGeometry(2, 2, 2),
            gateMaterial
        );

        detail.position.set(
            i * 10,
            2,
            zone.z - 47
        );

        map.add(detail);
    }
}

zones.forEach(createZone);

/* =========================================================
   BASES
   LAS 4 ESTÁN EN UNA SOLA LÍNEA HORIZONTAL
   ========================================================= */

const basePositions = [
    -75,
    -25,
    25,
    75
];

function createBase(x, number) {

    const baseMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xdddddd
        });

    const base = new THREE.Mesh(
        new THREE.BoxGeometry(38, 2, 32),
        baseMaterial
    );

    base.position.set(x, 1, 45);
    map.add(base);

    /* Casa */

    const houseMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xffffff
        });

    const house = new THREE.Mesh(
        new THREE.BoxGeometry(25, 18, 22),
        houseMaterial
    );

    house.position.set(x, 10, 45);
    map.add(house);

    /* Techo */

    const roofMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x333333
        });

    const roof = new THREE.Mesh(
        new THREE.ConeGeometry(18, 12, 4),
        roofMaterial
    );

    roof.rotation.y = Math.PI / 4;
    roof.position.set(x, 25, 45);
    map.add(roof);

    /* Nombre */

    const label = createTextSprite(
        "🏠 BASE " + number
    );

    label.position.set(x, 38, 45);
    label.scale.set(24, 8, 1);
    map.add(label);
}

basePositions.forEach((x, i) => {
    createBase(x, i + 1);
});

/* =========================================================
   PLAZA OWNER
   Está delante/abajo de las bases
   ========================================================= */

const plazaMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x302060,
        emissive: 0x24124c,
        emissiveIntensity: 0.4
    });

const plaza = new THREE.Mesh(
    new THREE.CylinderGeometry(18, 18, 2, 32),
    plazaMaterial
);

plaza.position.set(0, 1.5, 80);
map.add(plaza);

const plazaLabel = createTextSprite("👑 PLAZA OWNER 👑");

plazaLabel.position.set(0, 12, 80);
plazaLabel.scale.set(35, 10, 1);

map.add(plazaLabel);

/* =========================================================
   ÁRBOLES
   ========================================================= */

function createTree(x, z) {

    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(2, 2.5, 10, 8),
        new THREE.MeshStandardMaterial({
            color: 0x654321
        })
    );

    trunk.position.set(x, 5, z);
    map.add(trunk);

    const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(7, 8, 8),
        new THREE.MeshStandardMaterial({
            color: 0x217a38
        })
    );

    leaves.position.set(x, 12, z);
    map.add(leaves);
}

/* Bosque */

for (let x = -95; x <= 95; x += 25) {
    createTree(x, -120);
    createTree(x + 10, -145);
}

/* =========================================================
   CACTUS
   ========================================================= */

function createCactus(x, z) {

    const cactus = new THREE.Mesh(
        new THREE.CylinderGeometry(2, 2, 12, 8),
        new THREE.MeshStandardMaterial({
            color: 0x27843d
        })
    );

    cactus.position.set(x, 6, z);
    map.add(cactus);

    const arm = new THREE.Mesh(
        new THREE.BoxGeometry(7, 2, 2),
        new THREE.MeshStandardMaterial({
            color: 0x27843d
        })
    );

    arm.position.set(x + 3, 7, z);
    map.add(arm);
}

for (let x = -85; x <= 85; x += 35) {
    createCactus(x, -240);
}

/* =========================================================
   CRISTALES DE HIELO
   ========================================================= */

function createIce(x, z) {

    const crystal = new THREE.Mesh(
        new THREE.ConeGeometry(3, 14, 6),
        new THREE.MeshStandardMaterial({
            color: 0xc9f3ff,
            transparent: true,
            opacity: .9
        })
    );

    crystal.position.set(x, 7, z);
    map.add(crystal);
}

for (let x = -90; x <= 90; x += 30) {
    createIce(x, -360);
}

/* =========================================================
   VOLCANES
   ========================================================= */

function createVolcano(x, z) {

    const volcano = new THREE.Mesh(
        new THREE.ConeGeometry(18, 28, 8),
        new THREE.MeshStandardMaterial({
            color: 0x421919
        })
    );

    volcano.position.set(x, 14, z);
    map.add(volcano);

    const lava = new THREE.Mesh(
        new THREE.CylinderGeometry(5, 5, 2, 12),
        new THREE.MeshStandardMaterial({
            color: 0xff3300,
            emissive: 0xff2200,
            emissiveIntensity: 1
        })
    );

    lava.position.set(x, 28, z);
    map.add(lava);
}

createVolcano(-65, -480);
createVolcano(65, -480);

/* =========================================================
   ESTRELLAS PARA GALAXIA
   ========================================================= */

for (let i = 0; i < 70; i++) {

    const star = new THREE.Mesh(
        new THREE.SphereGeometry(.8, 6, 6),
        new THREE.MeshStandardMaterial({
            color: 0xffffff,
            emissive: 0xffffff,
            emissiveIntensity: 1
        })
    );

    star.position.set(
        (Math.random() - .5) * 210,
        Math.random() * 35 + 4,
        -720 + (Math.random() - .5) * 80
    );

    map.add(star);
}

/* =========================================================
   DOMINIO DIVINO
   ========================================================= */

for (let i = 0; i < 8; i++) {

    const pillar = new THREE.Mesh(
        new THREE.CylinderGeometry(3, 3, 35, 12),
        new THREE.MeshStandardMaterial({
            color: 0xffdf6b,
            emissive: 0xffc400,
            emissiveIntensity: .35
        })
    );

    pillar.position.set(
        -85 + i * 25,
        17,
        -960
    );

    map.add(pillar);
}

/* =========================================================
   TEXTO 3D SIMPLE
   ========================================================= */

function createTextSprite(text) {

    const canvas = document.createElement("canvas");
    canvas.width = 1024;
    canvas.height = 256;

    const ctx = canvas.getContext("2d");

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.font = "bold 70px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "white";
    ctx.strokeStyle = "black";
    ctx.lineWidth = 12;

    ctx.strokeText(
        text,
        canvas.width / 2,
        canvas.height / 2
    );

    ctx.fillText(
        text,
        canvas.width / 2,
        canvas.height / 2
    );

    const texture =
        new THREE.CanvasTexture(canvas);

    const material =
        new THREE.SpriteMaterial({
            map: texture,
            transparent: true
        });

    return new THREE.Sprite(material);
}

/* =========================================================
   JUGADOR
   ========================================================= */

const player = new THREE.Group();

const body = new THREE.Mesh(
    new THREE.BoxGeometry(4, 6, 3),
    new THREE.MeshStandardMaterial({
        color: 0x3366ff
    })
);

body.position.y = 5;
player.add(body);

const head = new THREE.Mesh(
    new THREE.BoxGeometry(4, 4, 4),
    new THREE.MeshStandardMaterial({
        color: 0xffcc99
    })
);

head.position.y = 10;
player.add(head);

player.position.set(0, 0, 20);

scene.add(player);

/* =========================================================
   MOVIMIENTO
   ========================================================= */

const keys = {};

document.addEventListener("keydown", e => {
    keys[e.code] = true;
});

document.addEventListener("keyup", e => {
    keys[e.code] = false;
});

let speed = 0.8;

function updatePlayer() {

    if (keys["ShiftLeft"] || keys["ShiftRight"]) {
        speed = 1.5;
    } else {
        speed = 0.8;
    }

    if (keys["KeyW"]) {
        player.position.z -= speed;
    }

    if (keys["KeyS"]) {
        player.position.z += speed;
    }

    if (keys["KeyA"]) {
        player.position.x -= speed;
    }

    if (keys["KeyD"]) {
        player.position.x += speed;
    }

    player.position.x =
        Math.max(-105, Math.min(105, player.position.x));

    player.position.z =
        Math.max(-1010, Math.min(90, player.position.z));
}

/* =========================================================
   CÁMARA TERCERA PERSONA
   ========================================================= */

function updateCamera() {

    const target = new THREE.Vector3(
        player.position.x,
        player.position.y + 6,
        player.position.z
    );

    const cameraPosition = new THREE.Vector3(
        player.position.x,
        player.position.y + 32,
        player.position.z + 38
    );

    camera.position.lerp(cameraPosition, 0.08);
    camera.lookAt(target);
}

/* =========================================================
   DETECTAR ZONA
   ========================================================= */

function updateZone() {

    let closest = zones[0];
    let bestDistance = Infinity;

    zones.forEach(zone => {

        const distance =
            Math.abs(player.position.z - zone.z);

        if (distance < bestDistance) {
            bestDistance = distance;
            closest = zone;
        }
    });

    document.getElementById("zone").textContent =
        closest.name;
}

/* =========================================================
   DINERO
   ========================================================= */

let money = 0;

setInterval(() => {

    money += 1;

    document.getElementById("money").textContent =
        money;

}, 1000);

/* =========================================================
   JUGAR
   ========================================================= */

document.getElementById("playButton")
    .addEventListener("click", () => {

        document.getElementById("startScreen")
            .style.display = "none";

        renderer.domElement.requestPointerLock?.();
    });

/* =========================================================
   ANIMACIÓN
   ========================================================= */

function animate() {

    requestAnimationFrame(animate);

    updatePlayer();
    updateCamera();
    updateZone();

    renderer.render(scene, camera);
}

animate();

/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});
</script>

</body>
</html>
